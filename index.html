  const [connStatus, setConnStatus] = useState('connecting');
  const isRemoteUpdate = useRef(false);
  // Spiegelt den aktuellen State synchron — nötig weil React 18 setState batcht
  // und die Updater-Funktion erst beim Render läuft.
  const stateRef = useRef(null);
  const lastKnownProfilesCount = useRef(0);
  const activeProfileIdRef = useRef(null); // für Closures in subscribe-Callback
  const [activeTab, setActiveTab] = useState('kalender');
  const [toasts, setToasts] = useState([]);
  const [editingProfile, setEditingProfile] = useState(null);
  const [calendarModal, setCalendarModal] = useState(null);
  const [calendarSelectedDate, setCalendarSelectedDate] = useState(null);
  const [sportModalDate, setSportModalDate] = useState(null);
  const [confirmDialog, setConfirmDialog] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [workScreenOpen, setWorkScreenOpen] = useState(false);
  const [showWorkAnalysis, setShowWorkAnalysis] = useState(false);
  const confirmCallbackRef = useRef(null); // hält den onConfirm-Callback stabil

  // _showConfirm global registrieren — DeleteButton ruft das auf
  useEffect(() => {
    _showConfirm = (message, onConfirm) => {
      confirmCallbackRef.current = onConfirm;
      setConfirmDialog({ message });
    };
    return () => { _showConfirm = null; };
  }, []);

  // Sobald man den Kalender-Tab verlässt, die Tagesauswahl zurücksetzen — beim
  // nächsten Aufruf des Kalenders soll wieder nichts ausgewählt sein (Standard: heute).
  useEffect(() => {
    if (activeTab !== 'kalender') setCalendarSelectedDate(null);
  }, [activeTab]);
  // Geräte-lokal: welches der (max. zwei) Profile wird auf DIESEM Handy angezeigt.
  const [activeProfileId, setActiveProfileId] = useState(() => getStoredActiveProfileId());

  useEffect(() => {
    if (activeProfileId) localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfileId);
    else localStorage.removeItem(ACTIVE_PROFILE_KEY);
    activeProfileIdRef.current = activeProfileId;
  }, [activeProfileId]);

  // Kurze Animation, sobald sich die Streak für das aktuell angezeigte Profil erhöht.
  // (über state direkt statt über die später definierte "activeProfile"-Konstante,
  // damit der Hook unbedingt vor jedem frühen Return aufgerufen wird.)
  const [streakBump, setStreakBump] = useState(false);
  const prevStreakRef = useRef({ profileId: null, streak: 0 });
  const liveProfileForStreak = state.profiles.find(p => p.id === activeProfileId) || null;
  const liveStreak = liveProfileForStreak ? computeStreak(liveProfileForStreak) : 0;
  useEffect(() => {
    const prev = prevStreakRef.current;
    if (activeProfileId && prev.profileId === activeProfileId && liveStreak > prev.streak) {
      setStreakBump(true);
      const t = setTimeout(() => setStreakBump(false), 1100);
      prevStreakRef.current = { profileId: activeProfileId, streak: liveStreak };
      return () => clearTimeout(t);
    }
    prevStreakRef.current = { profileId: activeProfileId, streak: liveStreak };
  }, [activeProfileId, liveStreak]);

  // Veraltete Arbeits-Sessions bereinigen: wenn clockedIn=true aber der Sitzungstag
  // nicht heute ist (App wurde geschlossen ohne auszustempeln), Session zurücksetzen.
  // Sicherheitsnetz für wirklich vergessene Sitzungen (>20h eingestempelt — z.B. Handy
  // war tagelang zu). Der normale Tageswechsel um Mitternacht wird NICHT hier behandelt,
  // sondern vom Tagesabschluss-Effekt weiter unten (der bucht korrekt statt zu verwerfen).
  useEffect(() => {
    if (loading) return;
    const hasStale = state.profiles.some(p =>
      p.work?.clockedIn && p.work?.sessionStart && (Date.now() - p.work.sessionStart) > 20 * 60 * 60 * 1000
    );
    if (!hasStale) return;
    update(s => {
      s.profiles.forEach(p => {
        if (!p.work?.clockedIn || !p.work?.sessionStart) return;
        if ((Date.now() - p.work.sessionStart) > 20 * 60 * 60 * 1000) {
          p.work.clockedIn = false;
          p.work.sessionStart = null;
          p.work.workedMinutesToday = 0;
          p.work.sessionDate = null;
          addLog(s, `🕐 ${p.name}: Vergessene Sitzung (>20h) automatisch verworfen.`);
        }
      });
    });
  }, [loading, dayTick]);

  // Mitternachts-Watcher: prüft minütlich, ob ein neuer Tag begonnen hat.
  // Löst dadurch die Tages-Checks (Fehlzeiten etc.) auch bei dauerhaft offener App aus.
  useEffect(() => {
    const iv = setInterval(() => {
      const now = todayBerlin();
      setDayTick(prev => (prev !== now ? now : prev));
    }, 60000);
    return () => clearInterval(iv);
  }, []);

  // Urlaubskonto jährlich zurücksetzen: vacationDaysUsed bezieht sich immer auf ein
  // bestimmtes Jahr (vacationYear). Ändert sich das Jahr, wird der Zähler genullt —
  // sonst würde die Urlaubsbilanz ab Januar mit dem Vorjahres-Verbrauch verrechnet.
  useEffect(() => {
    if (loading) return;
    const year = todayBerlin().slice(0, 4);
    const needsReset = state.profiles.some(p => p.work?.enabled && p.work.vacationYear !== year);
    if (!needsReset) return;
    update(s => {
      s.profiles.forEach(p => {
        if (!p.work?.enabled) return;
        if (p.work.vacationYear === year) return;
        const wasSet = !!p.work.vacationYear; // false beim allerersten Lauf (kein Log nötig)
        p.work.vacationDaysUsed = 0;
        p.work.vacationYear = year;
        if (wasSet) addLog(s, `🌴 ${p.name}: Urlaubskonto für ${year} zurückgesetzt.`);
      });
    });
  }, [loading, dayTick]);

  // Tagesabschluss um Mitternacht: seit dem Entfernen des Pause-Buttons wirkt
  // Ausstempeln nur noch wie eine Pause — die Minuten laufen in workedMinutesToday
  // auf, werden aber erst hier (sobald der Tag gewechselt hat) final verbucht:
  // Überstundenkonto + ein workLog-Eintrag für den ABGESCHLOSSENEN Tag.
  // War man um Mitternacht noch eingestempelt, wird die Sitzung an der Tagesgrenze
  // "geteilt" — der bisherige Teil wird abgerechnet, eine neue Sitzung beginnt sofort.
  useEffect(() => {
    if (loading) return;
    const today = todayBerlin();
    const needsFinalize = state.profiles.some(p =>
      p.work?.enabled && p.work.sessionDate && p.work.sessionDate !== today
    );
    if (!needsFinalize) return;
    update(s => {
      s.profiles.forEach(p => {
        if (!p.work?.enabled) return;
        const w = p.work;
        if (!w.sessionDate || w.sessionDate === today) return;
        const finalizedDate = w.sessionDate;
        let totalMinutes = w.workedMinutesToday || 0;
        const stillClockedIn = w.clockedIn;
        if (stillClockedIn) totalMinutes += calcCurrentSessionMinutes(w);
        totalMinutes = Math.round(totalMinutes);

        const isFree = !isRequiredWorkDayOn(w, finalizedDate);
        const reqMins = isFree ? 0 : (w.hoursPerDay || 8) * 60;
        const overtimeDelta = totalMinutes - reqMins;
        w.overtimeMinutes = (w.overtimeMinutes || 0) + overtimeDelta;
        if (!w.workLog) w.workLog = [];
        w.workLog.push({
          date: finalizedDate, type: 'work',
          workedMinutes: totalMinutes, requiredMinutes: reqMins, overtimeDelta,
        });
        addLog(s, `🕐 ${p.name}: Arbeitstag ${finalizedDate} abgeschlossen — ${formatHM(totalMinutes)} gearbeitet, ${overtimeDelta>=0?'+':''}${formatHM(overtimeDelta)} Überstunden.`);

        if (stillClockedIn) {
          // Nahtlos in den neuen Tag weiterlaufen lassen
          w.sessionStart = Date.now();
          w.sessionDate = today;
          w.workedMinutesToday = 0;
        } else {
          w.sessionDate = null;
          w.workedMinutesToday = 0;
        }
      });
    });
  }, [loading, dayTick]);

  // Fehlzeiten nachtragen: vergangene Soll-Arbeitstage ohne Eintrag werden als Fehlzeit
  // gebucht. Bucht immer nur bis gestern — der laufende Tag bleibt bis Mitternacht offen.
  // absenceCheckedUntil verhindert Doppelbuchungen; beim ersten Lauf wird es ohne
  // Rückwirkung gesetzt, damit nicht rückwirkend Monate auf einmal abgezogen werden.
  useEffect(() => {
    if (loading) return;
    const yesterday = addDays(todayBerlin(), -1);
    const needsCheck = state.profiles.some(p =>
      p.work?.enabled && (p.work.absenceCheckedUntil || null) !== yesterday
    );
    if (!needsCheck) return;
    update(s => {
      s.profiles.forEach(p => {
        if (!p.work?.enabled) return;
        if ((p.work.absenceCheckedUntil || null) === yesterday) return;
        // Erster Lauf → keine Rückwirkung, nur ab jetzt beobachten
        if (!p.work.absenceCheckedUntil) {
          p.work.absenceCheckedUntil = yesterday;
          return;
        }
        if (!p.work.workLog) p.work.workLog = [];
        const dayMins = (p.work.hoursPerDay || 8) * 60;
        let d = addDays(p.work.absenceCheckedUntil, 1);
        let missed = 0, guard = 0;
        while (d <= yesterday && guard++ < 400) {
          const hasEntry = p.work.workLog.some(e => e.date === d);
          const beforeStart = p.work.startDate && d < p.work.startDate;
          if (!hasEntry && !beforeStart && isRequiredWorkDayOn(p.work, d)) {
            p.work.overtimeMinutes = (p.work.overtimeMinutes || 0) - dayMins;
            p.work.workLog.push({
              date: d, type: 'absent',
              workedMinutes: 0, requiredMinutes: dayMins, overtimeDelta: -dayMins,
            });
            missed++;
          }
          d = addDays(d, 1);
        }
        p.work.absenceCheckedUntil = yesterday;
        if (missed > 0) {
          addLog(s, `⚠️ ${p.name}: ${missed} Arbeitstag${missed > 1 ? 'e' : ''} ohne Eintrag — ${formatHM(missed * dayMins)} Fehlzeit gebucht.`);
        }
      });
    });
  }, [loading, dayTick]);

  // Beim ersten Laden: bestehende Streaks auf ungezahlte Meilensteine prüfen.
  // Nötig wenn jemand schon vor dem Feature-Update eine lange Streak hatte.
  useEffect(() => {
    if (loading) return;
    const needsCheck = state.profiles.some(p => {
      const streak = computeStreak(p);
      return streak >= nextStreakUpgradeMilestone(p.streakUpgradePointsEarned || 0);
    });
    if (!needsCheck) return;
    update(s => {
      s.profiles.forEach(p => {
        const streak = computeStreak(p);
        let gained = 0;
        while (streak >= nextStreakUpgradeMilestone(p.streakUpgradePointsEarned || 0)) {
          p.streakUpgradePointsEarned = (p.streakUpgradePointsEarned || 0) + 1;
          p.abilityUpgradePoints = (p.abilityUpgradePoints || 0) + 1;
          gained++;
        }
        if (gained > 0) {
          addLog(s, `🔥 ${p.name}: ${gained} Streak-Meilenstein${gained > 1 ? 'e' : ''} nachgezählt (+${gained} Punkt${gained > 1 ? 'e' : ''}, Streak: ${streak} Tage).`);
        }
      });
    });
  }, [loading]);

  // Anonyme Anmeldung bei Firebase — nötig, damit die Security Rules (auth != null) greifen.
  useEffect(() => {
    let mounted = true;
    fbAuth.signInAnonymously().catch(e => console.error('TeamQuest: Anmeldung fehlgeschlagen', e));
    const unsub = fbAuth.onAuthStateChanged(user => { if (mounted && user) setAuthReady(true); });
    return () => { mounted = false; unsub(); };
  }, []);

  // Verbindungsstatus zur Firebase-Realtime-Database (eingebauter Indikator-Pfad).
  useEffect(() => {
    const ref = fbDb.ref('.info/connected');
    const handler = (snap) => setConnStatus(snap.val() ? 'online' : 'offline');
    ref.on('value', handler);
    return () => ref.off('value', handler);
  }, []);

  // Laden: Firebase-first, Ladescreen bis Antwort kommt.
  // Ein fehlgeschlagener Ladevorgang (Netzwerk, Timeout) wird als FEHLER behandelt
  // und erneut versucht — niemals als "keine Daten vorhanden" interpretiert.
  // Nur ein tatsächlich erfolgreicher Read mit snap.exists()===false gilt als "neuer Code".
  useEffect(() => {
    if (!authReady) return;
    let mounted = true;
    let attempt = 0;

    function tryLoad() {
      attempt++;
      Storage.ref(pairingCode).once('value').then(snap => {
        if (!mounted) return;
        const data = snap.exists() ? snap.val() : null;
        isRemoteUpdate.current = true;
        const loaded = migrateState(data) || initialState();
        stateRef.current = loaded;
        if ((loaded.profiles?.length || 0) > 0) lastKnownProfilesCount.current = loaded.profiles.length;
        setState(loaded);
        setLoading(false);
        setLoadError(null);
      }).catch(() => {
        if (!mounted) return;
        if (attempt < 5) {
          setTimeout(() => { if (mounted) tryLoad(); }, Math.min(2000 * attempt, 8000));
        } else {
          // Nach mehreren Fehlversuchen: Fehler anzeigen statt mit leerem Zustand weiterzumachen.
          setLoadError('Verbindung zur Datenbank fehlgeschlagen.');
        }
      });
    }
    tryLoad();

    // Live-Abo für Partneränderungen
    const unsubscribe = Storage.subscribe(pairingCode, (data) => {
      const incoming = migrateState(data) || initialState();
      const today = todayBerlin();
      incoming.profiles.forEach(p => {
        if (!p.questDeadlines) return;
        Object.keys(p.questDeadlines).forEach(id => {
          const d = p.questDeadlines[id];
          if (d && d.date < today) delete p.questDeadlines[id];
        });
      });
      isRemoteUpdate.current = true;
      setState(prev => {
        const ownId = activeProfileIdRef.current;
        const mergedProfiles = incoming.profiles.map(inP => {
          const prevP = prev.profiles.find(p => p.id === inP.id);
          if (!prevP) return inP;
          if (inP.id === ownId && prevP.work) {
            return { ...inP, work: {
              ...inP.work,
              clockedIn: prevP.work.clockedIn,
              sessionStart: prevP.work.sessionStart,
              sessionDate: prevP.work.sessionDate,
              overtimeMinutes: prevP.work.overtimeMinutes,
              workLog: prevP.work.workLog,
              vacationDays: prevP.work.vacationDays,
              vacationDaysUsed: prevP.work.vacationDaysUsed,
              vacationYear: prevP.work.vacationYear,
              sickDays: prevP.work.sickDays,
              workedMinutesToday: prevP.work.workedMinutesToday,
              absenceCheckedUntil: prevP.work.absenceCheckedUntil,
            }};
          }
          return inP;
        });
        const merged = { ...incoming, profiles: mergedProfiles };
        if ((prev.questsUpdatedAt || 0) > (incoming.questsUpdatedAt || 0)) {
          merged.quests = prev.quests;
          merged.questCategories = prev.questCategories;
          merged.questsUpdatedAt = prev.questsUpdatedAt;
        }
        return merged;
      });
    });
    return () => { mounted = false; unsubscribe(); };
  }, [authReady, pairingCode]);

  // stateRef immer synchron halten — auch bei setState-Aufrufen außerhalb von update().
  useEffect(() => { stateRef.current = state; }, [state]);

  // Persistenz-Netz: fängt State-Änderungen ab, die nicht über update() liefen.
  useEffect(() => {
    if (loading) return;
    if (isRemoteUpdate.current) { isRemoteUpdate.current = false; return; }
    if ((state.profiles?.length || 0) === 0 && (lastKnownProfilesCount.current || 0) > 0) {
      console.error('TeamQuest: Persistenz-Netz hat Profil-Löschung blockiert.');
      pushToast('⚠️ Speichern blockiert (Sicherheitssperre) — bitte Seite neu laden.', 'error');
      return;
    }
    if ((state.profiles?.length || 0) > 0) lastKnownProfilesCount.current = state.profiles.length;
    Storage.save(pairingCode, state);
  }, [state]);

  // Team-HP initialisieren sobald mind. ein Profil vorhanden und teamHp noch null.
  useEffect(() => {
    if (state.profiles.length >= 1 && state.combat.teamHp === null) {
      setState(s => ({ ...s, combat: { ...s.combat, teamHp: teamHpMax(s) } }));
    }
  }, [state.profiles.length]);

  if (loadError) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 text-center gap-3">
        <div className="text-3xl">⚠️</div>
        <div className="font-display text-lg font-bold text-hp">Laden fehlgeschlagen</div>
        <div className="text-sm text-inkDim max-w-xs">
          {loadError} Deine Daten sind dadurch NICHT verloren — die App wurde bewusst angehalten, um nichts zu überschreiben. Bitte Internetverbindung prüfen und neu laden.
        </div>
        <button onClick={() => window.location.reload()}
          className="mt-2 bg-gold text-bg font-semibold rounded-xl px-5 py-2.5 active:scale-95">
          Neu laden
        </button>
      </div>
    );
  }
  if (loading) return <LoadingScreen />;

  function pushToast(text, type) {
    const id = uid('toast');
    setToasts(t => [...t, { id, text, type: type || 'info' }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }

  // Zentraler State-Funnel: klont den aktuellen State, wendet den Mutator an,
  // setzt ihn und gibt ihn synchron zurück — so können Aufrufer sofort mit dem
  // neuen Stand weiterarbeiten, ohne auf den asynchronen React-Re-Render zu warten.
  // Schützt davor, dass ein Speichervorgang jemals ein befülltes Profil-Array
  // stillschweigend auf leer setzt (z. B. durch einen fehlerhaften/leeren Ladezustand,
  // der versehentlich zu Firebase gepusht wird). Echtes Trennen läuft über onUnpair,
  // das clearPairingCode() aufruft und diesen Pfad hier gar nicht mehr durchläuft.
  function guardAgainstProfileWipe(base, next) {
    if ((base?.profiles?.length || 0) > 0 && (next?.profiles?.length || 0) === 0) {
      console.error('TeamQuest: Speichern blockiert — hätte alle Profile gelöscht.', { base, next });
      return false;
    }
    if ((next?.profiles?.length || 0) > 0) lastKnownProfilesCount.current = next.profiles.length;
    return true;
  }

  function update(mutator) {
    const base = stateRef.current || state;
    const next = JSON.parse(JSON.stringify(base));
    mutator(next);
    if (!guardAgainstProfileWipe(base, next)) {
      pushToast('⚠️ Speichern blockiert (Sicherheitssperre) — bitte Seite neu laden.', 'error');
      return base;
    }
    stateRef.current = next;        // sofort verfügbar für Folge-Updates im selben Tick
    setState(next);
    Storage.save(pairingCode, next);
    return next;
  }

  // Wie update(), wartet aber auf die Server-Bestätigung und zeigt solange ein Overlay.
  // Für Aktionen, bei denen ein stiller Fehlschlag teuer wäre (Ein-/Ausstempeln).
  async function updateConfirmed(mutator, label) {
    const base = stateRef.current || state;
    const next = JSON.parse(JSON.stringify(base));
    mutator(next);
    if (!guardAgainstProfileWipe(base, next)) {
      pushToast('⚠️ Speichern blockiert (Sicherheitssperre) — bitte Seite neu laden.', 'error');
      return false;
    }
    stateRef.current = next;
    setState(next);
    setSyncing({ label: label || 'Speichern' });
    setSyncError(null);
    try {
      await Promise.race([
        Storage.saveConfirmed(pairingCode, next),
        new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000)),
      ]);
      setSyncing(null);
      return true;
    } catch (e) {
      setSyncing(null);
      setSyncError(label || 'Speichern');
      return false;
    }
  }

  const activeProfile = state.profiles.find(p => p.id === activeProfileId) || null;
  const partnerProfile = state.profiles.find(p => p.id !== activeProfileId) || null;

  if (!activeProfile) {
    if (editingProfile) {
      return (
        <ProfileEditor
          profile={editingProfile.isNew ? freshProfile({
            icon: ANIMAL_ICONS[state.profiles.length % ANIMAL_ICONS.length],
            color: PROFILE_COLORS[state.profiles.length % PROFILE_COLORS.length],
          }) : editingProfile}
          isNew={editingProfile.isNew}
          onCancel={() => setEditingProfile(null)}
          onSave={(data) => {
            const newProfile = freshProfile(Object.assign({}, data));
            update(s => { s.profiles.push(newProfile); });
            setActiveProfileId(newProfile.id);
            setEditingProfile(null);
          }}
        />
      );
    }
    return (
      <ProfileSelectScreen
        profiles={state.profiles}
        onSelect={(id) => setActiveProfileId(id)}
        onCreateNew={() => setEditingProfile({ isNew: true })}
      />
    );
  }

  function handleQuestComplete(questId, minutes = null, date = null) {
    let result;
    const next = update(s => {
      result = completeQuestStage(s, activeProfile.id, questId, minutes, date);
      // Frist nach Erledigung löschen
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (p && p.questDeadlines) delete p.questDeadlines[questId];
    });
    if (result.alreadyDone) return;
    const newLevel = next.profiles.find(p => p.id === activeProfile.id).level;
    if (result.leveledUp) pushToast(`🎉 Level Up! ${activeProfile.name} ist jetzt Level ${newLevel} — +1 Ability-Upgrade-Punkt.`, 'levelup');
    pushToast(
      result.actionGranted ? `Quest erledigt! +${result.xpGained} XP, +1 Kampf-Aktion` : `Quest erledigt! +${result.xpGained} XP`,
      'info'
    );
  }

  function handleQuestUncomplete(questId) {
    let result;
    update(s => { result = uncompleteQuestStage(s, activeProfile.id, questId); });
    if (!result || !result.ok) return;
    pushToast(
      result.xpRevoked > 0 ? `Rückgängig gemacht — -${result.xpRevoked} XP` : 'Rückgängig gemacht.',
      'info'
    );
  }

  function handleAddTodo(text) {
    update(s => {
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (!p) return;
      if (!p.todos) p.todos = [];
      p.todos.push({ id: uid('todo'), text, done: false, createdAt: Date.now(), doneAt: null });
    });
  }

  function handleCheckTodo(todoId) {
    update(s => {
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (!p || !p.todos) return;
      const t = p.todos.find(t => t.id === todoId);
      if (t) { t.done = true; t.doneAt = Date.now(); }
    });
  }

  function handleDeleteTodo(todoId) {
    update(s => {
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (!p) return;
      p.todos = (p.todos || []).filter(t => t.id !== todoId);
    });
  }

  function handleToggleWork() {
    update(s => {
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (p) {
        if (!p.work) p.work = {};
        p.work.enabled = !p.work.enabled;
        // Beim (Wieder-)Aktivieren: Fehlzeiten-Prüfung ab jetzt, nicht rückwirkend über
        // die Zeit, in der die Erfassung ausgeschaltet war (sonst gäbe es einen Batzen
        // nachträglicher Fehlzeiten für Tage, an denen gar nicht erfasst wurde).
        if (p.work.enabled) p.work.absenceCheckedUntil = addDays(todayBerlin(), -1);
      }
    });
  }

  function handleUpdateWorkSettings(newWork) {
    update(s => {
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (!p) return;
      const oldStartDate = p.work?.startDate || null;
      p.work = { ...(p.work||{}), ...newWork };

      // Anstellungsbeginn geändert (und tatsächlich gesetzt)? Dann gilt alles vor
      // diesem Datum als "vor dem Job" — sowohl fälschlich gebuchte Fehltage als
      // auch Arbeitstage mit Minus/Plus aus der Testphase werden storniert und
      // aus dem Log entfernt. Das Konto startet damit sauber ab dem neuen Datum.
      if ('startDate' in newWork && newWork.startDate && newWork.startDate !== oldStartDate) {
        const newStart = newWork.startDate;
        const toReverse = (p.work.workLog || []).filter(e => e.date < newStart);
        if (toReverse.length > 0) {
          toReverse.forEach(e => {
            p.work.overtimeMinutes = (p.work.overtimeMinutes || 0) - (e.overtimeDelta || 0);
          });
          p.work.workLog = (p.work.workLog || []).filter(e => e.date >= newStart);
          addLog(s, `🔄 ${p.name}: Anstellungsbeginn geändert — ${toReverse.length} Eintrag${toReverse.length > 1 ? 'e' : ''} vor dem ${newStart.split('-').reverse().join('.')} storniert (Konto ab jetzt bei diesem Datum sauber).`);
        }
      }
    });

  // Bereits gebuchte Fehltage in einem Zeitraum stornieren (z.B. wenn nachträglich
  // Urlaub oder Krankheit für diese Tage eingetragen wird).
  // Alle Einträge in einem Zeitraum neu bewerten, weil dort nachträglich Urlaub oder
  // Krankheit eingetragen wurde. Das Soll fällt für diese Tage weg:
  //   - reine Fehltage werden gelöscht und die Fehlzeit zurückgebucht
  //   - Arbeitstage behalten ihre Stunden, zählen aber komplett als Überstunden
  function clearAbsencesInRange(work, from, to) {
    const inRange = e => e.date >= from && e.date <= to;
    let clearedAbsences = 0, adjustedWork = 0;
    (work.workLog || []).forEach(e => {
      if (!inRange(e)) return;
      if (e.type === 'absent') {
        work.overtimeMinutes = (work.overtimeMinutes || 0) - (e.overtimeDelta || 0);
        clearedAbsences++;
      } else if (e.type === 'work') {
        // Soll entfällt → alles Gearbeitete wird zu Überstunden
        const newDelta = e.workedMinutes || 0;
        work.overtimeMinutes = (work.overtimeMinutes || 0) + (newDelta - (e.overtimeDelta || 0));
        e.requiredMinutes = 0;
        e.overtimeDelta = newDelta;
        adjustedWork++;
      }
    });
    work.workLog = (work.workLog || []).filter(e => !(e.type === 'absent' && inRange(e)));
    return { clearedAbsences, adjustedWork, total: clearedAbsences + adjustedWork };
  }

  function handleAddSickDay(from, to) {
    update(s => {
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (!p || !p.work) return;
      if (!p.work.sickDays) p.work.sickDays = [];
      p.work.sickDays.push({ id: uid('sick'), from, to, note: '' });
      const adj = clearAbsencesInRange(p.work, from, to);
      const parts = [];
      if (adj.clearedAbsences > 0) parts.push(`${adj.clearedAbsences} Fehltag${adj.clearedAbsences > 1 ? 'e' : ''} storniert`);
      if (adj.adjustedWork > 0) parts.push(`${adj.adjustedWork} Arbeitstag${adj.adjustedWork > 1 ? 'e' : ''} → Überstunden`);
      addLog(s, `🤒 ${p.name} krank: ${from} bis ${to}.${parts.length ? ' ' + parts.join(', ') + '.' : ''}`);
    });
  }

      if (!p || !p.work || !p.work.sickDays) return;
      const entry = p.work.sickDays.find(x => x.id === sickId || x.from === sickId);
      if (!entry) return;
      p.work.sickDays = p.work.sickDays.filter(x => x.id !== sickId && x.from !== sickId);

  function handleAddVacation(from, to, type = 'vacation') {
    update(s => {
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (!p || !p.work) return;
      if (!p.work.vacationDays) p.work.vacationDays = [];
      // Bereits gebuchte Fehltage in diesem Zeitraum zuerst stornieren
      const adjV = clearAbsencesInRange(p.work, from, to);
      const clearedAbs = adjV.total;
      const days = countWorkDays(from, to, p.work); // Feiertage automatisch raus
      const minutesNeeded = days * (p.work.hoursPerDay || 8) * 60;
      if (type === 'overtime') {
        if ((p.work.overtimeMinutes || 0) < minutesNeeded) return; // nicht genug Überstunden
        p.work.overtimeMinutes = (p.work.overtimeMinutes || 0) - minutesNeeded;
        p.work.vacationDays.push({ id: uid('vac'), from, to, type: 'overtime', days, minutesDeducted: minutesNeeded });
        addLog(s, `🌴 ${p.name} Urlaub (Überstunden): ${from}–${to} (${days} Tage, ${formatHM(minutesNeeded)} abgezogen).${clearedAbs > 0 ? ` ${clearedAbs} Tag${clearedAbs > 1 ? 'e' : ''} neu verrechnet.` : ''}`);
      } else {
        if (calcAvailableVacation(p.work) < days) return; // nicht genug Urlaubstage
        p.work.vacationDaysUsed = (p.work.vacationDaysUsed || 0) + days;
        p.work.vacationDays.push({ id: uid('vac'), from, to, type: 'vacation', days });
        addLog(s, `🌴 ${p.name} Urlaub: ${from}–${to} (${days} Arbeitstage).${clearedAbs > 0 ? ` ${clearedAbs} Tag${clearedAbs > 1 ? 'e' : ''} neu verrechnet.` : ''}`);
      }
    });
  }

  function handleBuyOvertime(amount = 1) {

  function handleConvertVacToOT(days) {
    const avail = calcAvailableVacation(activeProfile.work || {});
    if (!(days > 0) || days > avail) {
      pushToast('⚠️ Nicht genug Urlaubstage verfügbar.', 'error');
      return;
    }
    update(s => {
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (!p || !p.work) return;
      const mins = Math.round(days * (p.work.hoursPerDay || 8) * 60);
      p.work.vacationDaysUsed = (p.work.vacationDaysUsed || 0) + days;
      p.work.overtimeMinutes = (p.work.overtimeMinutes || 0) + mins;
      addLog(s, `🌴→⏱ ${p.name}: ${days} Urlaubstag${days!==1?'e':''} → ${formatHM(mins)} Überstunden.`);
    });
    pushToast(`${days} Urlaubstag${days!==1?'e':''} → Überstunden`, 'info');
  }

  function handleDeleteVacation(vacId) {
    update(s => {
      const p = s.profiles.find(pr => pr.id === activeProfile.id);
      if (!p || !p.work || !p.work.vacationDays) return;
      const entry = p.work.vacationDays.find(v => v.id === vacId || v.from === vacId);
      if (!entry) return;
      // Tage neu berechnen falls nicht gespeichert (Alteinträge)
      let days = entry.days;
      if (!days && entry.from && entry.to) {
        days = 0;
        let d = entry.from;
        while (d <= entry.to) {
          const dow = new Date(d + 'T00:00:00').getDay();
          if ((p.work.workDays || [1,2,3,4,5]).includes(dow)) days++;
          d = addDays(d, 1);
        }
      }
      if (entry.type === 'overtime') {
        const mins = entry.minutesDeducted || days * (p.work.hoursPerDay || 8) * 60;
        p.work.overtimeMinutes = (p.work.overtimeMinutes || 0) + mins;
      } else {
        p.work.vacationDaysUsed = Math.max(0, (p.work.vacationDaysUsed || 0) - (days || 0));
      }
      p.work.vacationDays = p.work.vacationDays.filter(v => v.id !== vacId && v.from !== vacId);
      addLog(s, `↩️ ${p.name}: Urlaub ${entry.from}–${entry.to} rückgängig (${days} Tage zurück).`);
    });
  }

        <WorkTimerScreen
          profile={activeProfile}
          onClose={() => setWorkScreenOpen(false)}
          onClockIn={handleWorkClockIn}
          onClockOut={handleWorkClockOut}
          onAddSickDay={handleAddSickDay}
          onDeleteSickDay={handleDeleteSickDay}
          onAddVacation={handleAddVacation}
          onDeleteVacation={handleDeleteVacation}
          onBuyOvertime={handleBuyOvertime}
          onConvertVacToOT={handleConvertVacToOT}
          onReset={handleWorkReset}
          onSetOvertimeManually={handleSetOvertimeManually}
        />
      )}

      {/* Arbeitszeit-Analyse */}
      {showWorkAnalysis && (
        <WorkAnalysis profile={activeProfile} onClose={() => setShowWorkAnalysis(false)} />
      )}

      <TodoSidebar
        profile={activeProfile}
        open={sidebarOpen}
        onToggle={() => setSidebarOpen(o => !o)}
        onAdd={handleAddTodo}
        onCheck={handleCheckTodo}
        onDelete={handleDeleteTodo}
      />

      <div className="sticky top-0 z-30 bg-bgElevated/95 backdrop-blur border-b border-border relative">
        <div className="px-4 py-3 flex items-center justify-between relative">
          <div className="flex items-center gap-2">
            <button onClick={() => setSidebarOpen(o => !o)}
              className="text-inkDim w-7 h-7 flex items-center justify-center rounded-lg active:scale-95"
              aria-label="Notizen öffnen">
              📝
            </button>
            <div className="font-display font-bold text-gold text-base tracking-wide flex items-center gap-1.5">
              TeamQuest
              <ConnectionDot status={connStatus} />
            </div>
          </div>
          <div className="absolute left-1/2 -translate-x-1/2 flex items-center gap-1.5"
            title={`Beste Streak: ${computeBestStreak(activeProfile)} Tage`}>
            <div className={`flex items-center gap-1.5 ${streakBump ? 'streak-pop' : ''}`}>
              <span className="text-lg leading-none">🔥</span>
              <span className="font-stat text-xl text-orange font-bold leading-none">{computeStreak(activeProfile)}</span>
            </div>
            {streakBump && (
              <span className="absolute -top-2 left-1/2 -translate-x-1/2 text-[11px] font-stat font-bold text-orange float-num pointer-events-none">+1</span>
            )}
          </div>
          <div className="flex items-center gap-2">
            <span className="font-stat text-lg text-gold font-bold leading-none">
              {activeProfile.gold}<span className="font-display text-sm ml-0.5">G</span>
            </span>
            <button onClick={() => setActiveProfileId(null)} aria-label="Profil wechseln">
              <ProfileAvatar profile={activeProfile} size={30} />
            </button>
          </div>
        </div>
        <div className="px-4 pb-1.5 flex items-center gap-2">
          <div className="flex-1 h-[3px] bg-surface rounded-full overflow-hidden">
            <div className="h-full bg-gradient-to-r from-gold to-goldBright transition-all duration-500"
              style={{ width: `${Math.min(100, (activeProfile.xp / xpForLevel(activeProfile.level)) * 100)}%` }} />
          </div>
          <span className="text-[10px] font-stat text-inkDim shrink-0 leading-none">Lvl {activeProfile.level}</span>
        </div>
      </div>

      {activeTab === 'quests' && (
        <QuestsTab state={state} profile={activeProfile} onQuestComplete={handleQuestComplete} onQuestUncomplete={handleQuestUncomplete} onAddQuest={handleAddQuest} onEditQuests={handleEditQuests} onSetDeadline={handleSetDeadline}
          onCalendarComplete={handleCalendarComplete}
          onCalendarUncomplete={handleCalendarUncomplete}
          onOpenAddCalendar={() => setCalendarModal({ mode: 'add', date: todayBerlin() })}
          onOpenEditCalendar={(item) => setCalendarModal({ mode: 'edit', item })} />
      )}
      {activeTab === 'kampf' && (
        <CombatTab state={state} profiles={state.profiles} activeProfileId={activeProfile.id} onUseAbility={handleUseAbility} onUpgradeAbility={handleUpgradeAbility} />
      )}
      {activeTab === 'kalender' && (
        <div className="px-4 pt-4 pb-28 space-y-4">
          <CalendarGrid profile={activeProfile} calendarItems={state.calendarItems}
            birthdays={state.birthdays || []}
            selectedDate={calendarSelectedDate} onSelectDate={setCalendarSelectedDate} />
          <button onClick={() => setCalendarModal({ mode: 'add', date: calendarViewedDate })}
            className="w-full border border-dashed border-border rounded-2xl py-3 text-sm text-inkDim active:scale-[0.99]">
            + Aufgabe / Termin hinzufügen
          </button>
          {activeProfile.sportTrackingEnabled && (() => {
            const existingSport = activeProfile.sportLog && activeProfile.sportLog[calendarViewedDate];
            const parts = [];
            if (existingSport) {
              if (existingSport.calories != null) parts.push(`${existingSport.calories} kcal`);
              if (existingSport.protein != null) parts.push(`${existingSport.protein} g Protein`);
              if (existingSport.weight != null) parts.push(`${existingSport.weight} kg`);
            }
            return (
              <button onClick={() => setSportModalDate(calendarViewedDate)}
                className="w-full border border-dashed border-sport/50 rounded-2xl py-3 text-sm text-sport active:scale-[0.99]">
                {parts.length > 0 ? `🏋️ ${parts.join(' · ')}` : '🏋️ Sport-Tracken'}
              </button>
            );
          })()}
          <div className="bg-surface border border-border rounded-2xl p-4">
            <SectionLabel>
              {calendarViewedDate === todayBerlin() ? `Tagesblick · Heute · ${formatShortDateWithYear(calendarViewedDate)}` : `Tagesblick · ${formatShortDateWithYear(calendarViewedDate)} ${weekdayLabelFor(calendarViewedDate)}`}
            </SectionLabel>

            {/* Feiertag-Banner */}
            {(activeProfile.work?.enabled) && rlpHolidayName(calendarViewedDate) && (
              <div className="flex items-center gap-2 rounded-xl border border-orange/40 bg-orange/8 px-3 py-2 mb-2">
                <span className="text-orange text-sm">✦</span>
                <div>
                  <div className="text-sm font-semibold text-orange">{rlpHolidayName(calendarViewedDate)}</div>
                  <div className="text-[10px] text-inkDim">Gesetzlicher Feiertag · RLP</div>
                </div>
              </div>
            )}

            {calendarViewedDate === todayBerlin() && allUpcomingDeadlines.length > 0 && (
              <div className="mb-3">
                <DeadlineCarousel
                  deadlines={allUpcomingDeadlines}
                  onComplete={(questId) => handleQuestComplete(questId, 'komplett')}
                />
              </div>
            )}

            {dayAgendaForCalendarTab.length === 0 && birthdaysForDay.length === 0 && questDeadlinesForDay.filter(({ quest, deadline }) => { const dp = (activeProfile.questProgress || {})[calendarViewedDate] || {}; return dp[quest.id] !== 'komplett'; }).length === 0 ? (
              <div className="text-xs text-inkDim">
                {calendarViewedDate === todayBerlin() ? 'Keine Aufgaben oder Termine heute.' : 'Keine Aufgaben oder Termine an diesem Tag.'}
              </div>
            ) : (
              <div className="space-y-2">
                {calendarViewedDate !== todayBerlin() && (() => {
                  const dayProgress = (activeProfile.questProgress || {})[calendarViewedDate] || {};
                  const active = questDeadlinesForDay.filter(({ quest, deadline }) => {
                    const done = dayProgress[quest.id] === 'komplett';
                    const failed = !done && deadline.date < todayBerlin();
                    return !done && !failed;
                  });
                  const doneOrFailed = questDeadlinesForDay.filter(({ quest, deadline }) => {
                    const done = dayProgress[quest.id] === 'komplett';
                    const failed = !done && deadline.date < todayBerlin();
                    return done || failed;
                  });
                  return (<>
                    {active.length > 0 && (
                      <DeadlineCarousel
                        deadlines={active}
                        onComplete={(questId) => handleQuestComplete(questId, 'komplett')}
                      />
                    )}
                    {doneOrFailed.map(({ quest, deadline }) => (
                      <DeadlineRow key={quest.id} quest={quest} deadline={deadline}
                        calendarViewedDate={calendarViewedDate} activeProfile={activeProfile}
                        onComplete={() => handleQuestComplete(quest.id, 'komplett')} />
                    ))}
                  </>);
                })()}
                {dayAgendaForCalendarTab.map(entry => (
                  <AgendaItemRow key={entry.item.id + '_' + entry.scheduledDate} entry={entry} profiles={state.profiles}
                    onComplete={handleCalendarComplete} onUncomplete={handleCalendarUncomplete} onEdit={(item) => setCalendarModal({ mode: 'edit', item })}
                    actionable={calendarViewedDate <= todayBerlin()} showDate={false} />
                ))}
                {birthdaysForDay.map(b => {
                  const age = b.year ? cvYear - b.year : null;
                  return (
                    <div key={b.id} className="flex items-center gap-2.5 rounded-xl border border-birthday/50 bg-birthday/5 px-3 py-2.5">
                      <span className="text-lg shrink-0">🎂</span>
                      <div className="flex-1 min-w-0">
                        <div className="text-sm text-ink truncate">{b.name}</div>
                        <div className="text-[10px] text-birthday">
                          Geburtstag{age != null ? ` · wird ${age}` : ''}
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            <UpcomingAgendaList entries={upcomingAgendaForCalendarTab} profiles={state.profiles}
              birthdays={state.birthdays} activeProfileId={activeProfile.id}
              questDeadlines={activeProfile.questDeadlines || {}} quests={state.quests}
              questProgress={activeProfile.questProgress || {}}
              onEdit={(item) => setCalendarModal({ mode: 'edit', item })} />
            <CompletionLogList entries={getCompletionLog(state, 100, activeProfile.id)} profiles={state.profiles} onEdit={(item) => setCalendarModal({ mode: 'edit', item })} />
          </div>
          <SelectedDayQuestsCard profile={activeProfile} quests={state.quests} selectedDate={calendarSelectedDate} />
          {/* Legende ganz unten, außerhalb aller Blöcke */}
          <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-[10px] text-inkDim px-1 pt-1">
            <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-heal"></span>Quest erledigt</span>
            <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-orange"></span>Aufgabe geplant</span>
            <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-shield"></span>Termin geplant</span>
            {activeProfile.sportTrackingEnabled && (
              <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-sport"></span>Sport getrackt</span>
            )}
            {(state.birthdays && state.birthdays.length > 0) && (
              <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-birthday"></span>Geburtstag</span>
            )}
            <span className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-hp flex items-center justify-center text-[6px] text-white font-bold">!</span>Frist</span>
            {(activeProfile.work?.enabled) && (
              <span className="flex items-center gap-1"><span className="text-orange text-[8px]">✦</span>Feiertag (RLP)</span>
            )}
          </div>
        </div>
      )}
      {calendarModal && (
        <CalendarItemModal
          editingItem={calendarModal.mode === 'edit' ? calendarModal.item : null}
          defaultDate={calendarModal.mode === 'add' ? calendarModal.date : todayBerlin()}
          onClose={() => setCalendarModal(null)}
          onSave={handleSaveCalendarItem}
          onDelete={handleDeleteCalendarItem}
        />
      )}
      {sportModalDate && (
        <SportTrackModal
          date={sportModalDate}
          existing={activeProfile.sportLog && activeProfile.sportLog[sportModalDate]}
          onSave={handleSaveSportLog}
          onDelete={handleDeleteSportLog}
          onClose={() => setSportModalDate(null)}
        />
      )}
      {activeTab === 'mehr' && (
        <MoreTab
          state={state} profile={activeProfile}
          pairingCode={pairingCode} connStatus={connStatus}
          onSwitchProfile={() => setActiveProfileId(null)}
          onEditProfile={(p) => setEditingProfile(p)}
          onExport={handleExport} onImport={handleImport}
          onUnpair={onUnpair}
          onToggleSportTracking={handleToggleSportTracking}
          onToggleWork={handleToggleWork}
          onUpdateWorkSettings={handleUpdateWorkSettings}
          onShowWorkAnalysis={() => setShowWorkAnalysis(true)}
          onAddBirthday={handleAddBirthday}
          onDeleteBirthday={handleDeleteBirthday}
        />
      )}

      <BottomNav active={activeTab} setActive={setActiveTab}
        badges={{ kalender: calendarBadgeCount }}
        showTimerButton={(activeProfile.work||{}).enabled}
        timerRunning={!!(activeProfile.work||{}).clockedIn}
        onTimerOpen={() => setWorkScreenOpen(true)} />

      {editingProfile && !editingProfile.isNew && (
        <ProfileEditor
          profile={editingProfile}
          isNew={false}
          onCancel={() => setEditingProfile(null)}
          onSave={(data) => {
            update(s => {
              const p = s.profiles.find(pr => pr.id === editingProfile.id);
              Object.assign(p, data);
            });
            setEditingProfile(null);
          }}
        />
      )}
    </div>
    {confirmDialog && (
      <div className="fixed inset-0 z-[999] flex items-center justify-center bg-black/70 px-4"
        onPointerDown={() => setConfirmDialog(null)}>
        <div className="bg-bgElevated border border-border rounded-2xl w-full max-w-sm shadow-xl"
          onPointerDown={e => e.stopPropagation()}>
          <div className="px-5 pt-5 pb-2">
            <h3 className="font-display font-bold text-gold text-lg mb-2">Sicher?</h3>
            <p className="text-sm text-inkDim leading-relaxed">{confirmDialog.message}</p>
          </div>
          <div className="flex gap-2 px-5 pb-5 pt-3">
            <button
              onPointerDown={e => { e.stopPropagation(); setConfirmDialog(null); }}
              className="flex-1 border border-border rounded-xl py-3 text-sm text-inkDim active:scale-95"
              style={{ touchAction: 'manipulation' }}>
              Abbrechen
            </button>
            <button
              onPointerDown={e => { e.stopPropagation(); confirmCallbackRef.current?.(); setConfirmDialog(null); }}
              className="flex-1 bg-hp text-white font-semibold rounded-xl py-3 text-sm active:scale-95"
              style={{ touchAction: 'manipulation' }}>
              Löschen
            </button>
          </div>
        </div>
      </div>
    )}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
