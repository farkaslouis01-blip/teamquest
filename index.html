const BOSS_TIERS = [
  { name: 'Wegelagerer', emoji: '👹', hp: 100, gold: 10 },
  { name: 'Wildschwein-Alpha', emoji: '🐗', hp: 160, gold: 16 },
  { name: 'Drachenwache', emoji: '🐉', hp: 240, gold: 25 },
  { name: 'Schattenfürst', emoji: '💀', hp: 400, gold: 50 },
];
const COUNTER_DAMAGE = [10, 16, 24, 40];

function bossStatsForTier(tier) {
  const idx = Math.min(tier, BOSS_TIERS.length - 1);
  return BOSS_TIERS[idx];
}
function counterDamageForTier(tier) {
  const idx = Math.min(tier, COUNTER_DAMAGE.length - 1);
  return COUNTER_DAMAGE[idx];
}
function bossDisplayName(tier) {
  const base = bossStatsForTier(tier).name;
  return tier >= BOSS_TIERS.length ? `${base} — Rang ${tier - BOSS_TIERS.length + 2}` : base;
}

function xpForLevel(level) {
  // XP, um von Level `level` auf `level + 1` zu kommen
  return 90 + 5 * level * (level + 1);
}

// Streak-Meilensteine: 10, 22, 36, 52, 70, ...
// Zwischen den Meilensteinen: +12, +14, +16, ... (jeweils 2 mehr)
// Formel für den n-ten Meilenstein (1-basiert): 10 + (n-1) * (10 + n)
function streakMilestoneN(n) {
  return 10 + (n - 1) * (10 + n);
}
// Nächster Meilenstein — abhängig davon wie viele Upgradepunkte aus Streaks schon verdient wurden
function nextStreakUpgradeMilestone(pointsEarned) {
  return streakMilestoneN((pointsEarned || 0) + 1);
}

const DEFAULT_QUEST_CATEGORIES = ['Körperpflege', 'Haushalt', 'Sport'];

// Quests haben keinen eigenen XP-Wert mehr — XP wird zur Laufzeit anhand der

  { id: 'sp1', title: 'Cardio', icon: '🏃', category: 'Sport', custom: false },
  { id: 'sp2', title: 'Krafttraining', icon: '🏋️', category: 'Sport', custom: false },
];

const METHODS = [
  { unlockLevel: 1, title: 'Die 2-Minuten-Regel', source: 'NICE-Leitlinie NG87',
    text: 'Wenn eine Aufgabe schwer zu starten ist, reicht es, sich nur 2 Minuten dafür zu verpflichten. Der Start ist die eigentliche Hürde — danach läuft es meist von allein weiter. Deshalb zählt "Kurz begonnen" in TeamQuest als vollwertige Aktion.' },
  { unlockLevel: 2, title: 'Reiz-Kopplung (Temptation Bundling)', source: 'Milkman et al., Wharton',
    text: 'Kopple eine unangenehme Aufgabe an etwas, das dir Freude macht — z. B. nur beim Spülen deinen Lieblingspodcast hören. Die Belohnung läuft parallel zur Aufgabe statt erst danach.' },
  { unlockLevel: 4, title: 'Externe Struktur & Body Doubling', source: 'NICE-Leitlinie / Body-Doubling-Forschung',
    text: 'Allein die Anwesenheit einer anderen Person — auch ohne aktive Hilfe — erleichtert vielen Menschen mit ADS den Start und das Durchhalten einer Aufgabe. Erledigt eine Quest gemeinsam, auch wenn nur einer von euch aktiv ist.' },

function topUnlockedMethod(profile) {
  const unlocked = METHODS.filter(m => profile.level >= m.unlockLevel);
  return unlocked.length ? unlocked[unlocked.length - 1] : null;
}

const CALENDAR_XP_PER_TASK = 5;
const CALENDAR_XP_DAILY_CAP = 10;
const WEEKDAY_LABELS = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

// Quest-XP: pauschal für alle normalen Quests, formelbasiert für Sport — kein Tagesdeckel mehr.
const SPORT_CATEGORY = 'Sport';
const REGULAR_QUEST_XP = 10;
function sportQuestXp(minutes) {
  const m = Math.max(0, Math.floor(minutes || 0));
  return 3 + 3 * Math.floor(m / 5);
}

// Kampf-Aktionen: kein festes Tageslimit mehr — stattdessen Fibonacci-Schwellen auf
// Basis der heute erledigten Quests (kumulativ): 1, 2, 4, 7, 12, 20, 33, 54, 88, ...
// FIB_ACTION_THRESHOLDS[i] = wie viele Quests insgesamt nötig sind für die (i+1)-te Aktion.
const FIB_ACTION_THRESHOLDS = (() => {
  const arr = [];
  let a = 1, b = 1, sum = 0;
  for (let i = 0; i < 25; i++) { sum += a; arr.push(sum); [a, b] = [b, a + b]; }
  return arr;
})();
function actionsEarnedForQuestCount(count) {
  return FIB_ACTION_THRESHOLDS.filter(t => t <= count).length;
}
function nextActionThreshold(count) {
  return FIB_ACTION_THRESHOLDS.find(t => t > count) ?? (FIB_ACTION_THRESHOLDS[FIB_ACTION_THRESHOLDS.length - 1] + 1);
}

/* ============================================================
   2. HILFSFUNKTIONEN
   ============================================================ */

function uid(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}

// Alle Tagesgrenzen laufen über die deutsche Zeitzone, nicht über Gerätezeit.
function todayBerlin() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
}

function rollVariance(base) {
  const factor = 0.85 + Math.random() * 0.30; // 0.85 – 1.15
  return Math.max(1, Math.round(base * factor));
}

function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

/* ============================================================
   3. STORAGE-SCHICHT (Firebase Realtime Database)
   ------------------------------------------------------------
   Ersetzt die alte localStorage-Lösung. Beide Geräte lesen/schreiben
   denselben Pfad teamquest/{pairingCode} in der Firebase Realtime
   Database — Änderungen kommen per Push in Echtzeit an (kein Polling).

   EINRICHTUNG (einmalig):
   1. Auf https://console.firebase.google.com ein Projekt anlegen.
   2. Im Menü "Build" -> "Realtime Database" -> Datenbank erstellen
      (Startmodus "Testmodus" reicht erstmal, Regeln kommen unten rein).
   3. Im Menü "Build" -> "Authentication" -> "Sign-in method" ->
      "Anonym" aktivieren.
   4. Unter Projekteinstellungen (Zahnrad) -> "Meine Apps" -> Web-App
      hinzufügen (</> Symbol) -> die angezeigten Werte unten in
      FIREBASE_CONFIG eintragen.
   5. In Realtime Database -> "Regeln" folgendes einfügen und
      veröffentlichen:
       {
         "rules": {
           "teamquest": {
             "$code": {
               ".read": "auth != null",
               ".write": "auth != null"
             }
           }
         }
       }
   ============================================================ */

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDGlPWc-Bl1mwFZaBtaTw5s5wOyf_wGlJU",
  authDomain: "teamquest-8b291.firebaseapp.com",
  databaseURL: "https://teamquest-8b291-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "teamquest-8b291",
};

let fbAuth = null, fbDb = null, FIREBASE_READY = false;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  fbAuth = firebase.auth();
  fbDb = firebase.database();
  FIREBASE_READY = true;
} catch (e) {
  console.error('TeamQuest: Firebase-Initialisierung fehlgeschlagen — FIREBASE_CONFIG korrekt?', e);
}

// Offline-Persistenz separat — Fehler hier blockieren die App nicht.
if (FIREBASE_READY) {
  try { fbDb.setPersistenceEnabled(true); } catch (e) { /* ignorieren */ }
}


// Eindeutige Kennung für dieses Gerät/diese Seitenladung — verhindert, dass
// ein eigener Schreibvorgang beim Zurücklesen als neue Partner-Änderung
// missverstanden wird (würde sonst zu einer Endlosschleife führen).
const CLIENT_ID = uid('client');

const PAIRING_KEY = 'teamquest_pairing_code_v1';
function getPairingCode() { return localStorage.getItem(PAIRING_KEY); }
function setStoredPairingCode(code) { localStorage.setItem(PAIRING_KEY, code); }
function clearPairingCode() { localStorage.removeItem(PAIRING_KEY); }

// Welches Profil auf DIESEM Gerät gerade angezeigt wird — bewusst NICHT Teil des
// synchronisierten States, sonst würde ein Profilwechsel auf einem Gerät auch das
// andere Gerät umschalten.
const ACTIVE_PROFILE_KEY = 'teamquest_active_profile_v1';
function getStoredActiveProfileId() { return localStorage.getItem(ACTIVE_PROFILE_KEY); }

// App-Größe auf DIESEM Gerät — unabhängig von der Anzeigegröße/Schriftgröße des
// Telefons selbst. Skaliert die Root-Schriftgröße, an der alle (rem-basierten)
// Tailwind-Maße hängen, wirkt also wie ein eigener, geräteweiter Zoom-Regler nur
// für diese App. Bewusst NICHT Teil des synchronisierten States (reine Geräte-Präferenz).
const UI_SCALE_KEY = 'teamquest_ui_scale_v1';
function getStoredUiScale() {
  const v = parseFloat(localStorage.getItem(UI_SCALE_KEY));
  return (!isNaN(v) && v >= 0.7 && v <= 1.3) ? v : 1;
}
function applyUiScale(scale) {
  document.documentElement.style.fontSize = (16 * scale) + 'px';
}

function generatePairingCode() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // ohne I/O/0/1 — Verwechslungsgefahr beim Abtippen
  let code = '';
  for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  return code;
}

// Globales Bestätigungs-Modal — rendert auf App-Root-Ebene, außerhalb
// aller scrollbaren Container und animierten Elemente.
let _showConfirm = null;
function showConfirm(message, onConfirm) {
  if (_showConfirm) _showConfirm(message, onConfirm);
}

const Storage = {
  ref(code) { return fbDb.ref('teamquest/' + code); },
  async load(code) {
    try {
      const snap = await this.ref(code).get();
      return snap.exists() ? snap.val() : null;
    } catch (e) {
      console.error('TeamQuest: Laden fehlgeschlagen', e);
      return null;
    }
  },
  save(code, state) {
    try {
      const payload = Object.assign({}, state, { _meta: { updatedBy: CLIENT_ID, updatedAt: Date.now() } });
      this.ref(code).set(payload).catch(e => console.error('TeamQuest: Speichern fehlgeschlagen', e));
      return true;
    } catch (e) {
      console.error('TeamQuest: Speichern fehlgeschlagen', e);
      return false;
    }
  },
  // Wie save(), aber mit Promise — für Aktionen, bei denen wir auf die Bestätigung
  // vom Server warten wollen (Ein-/Ausstempeln). Wirft bei Fehler.
  saveConfirmed(code, state) {
    const payload = Object.assign({}, state, { _meta: { updatedBy: CLIENT_ID, updatedAt: Date.now() } });
    return this.ref(code).set(payload);
  },
  // Live-Abo: feuert bei jeder Änderung am Pfad (eigene Schreibvorgänge ausgenommen).
  subscribe(code, onChange) {
    const handler = (snap) => {
      const data = snap.val();
      if (!data) return;
      if (data._meta && data._meta.updatedBy === CLIENT_ID) return; // eigenes Echo ignorieren
      onChange(data);
    };
    this.ref(code).on('value', handler);
    return () => this.ref(code).off('value', handler);
  }
};

/* ============================================================
   4b. MIGRATION ALTER GESPEICHERTER DATEN
   ------------------------------------------------------------
   Wenn die App schon vor einem Feature-Update benutzt wurde, fehlen im
   gespeicherten Stand neuere Felder (z. B. questCategories). Diese
   Funktion rüstet sie defensiv nach, damit alte Spielstände nicht zum
   Absturz führen.
   ============================================================ */

function migrateState(loaded) {
  if (!loaded) return null;
  const base = initialState();
  const merged = Object.assign({}, base, loaded);

  // EINMALIGE Migration: komplette Quest-Neugestaltung (Körperpflege/Haushalt/Sport,
  // kein "Nur kurz" mehr, kein XP-Wert mehr pro Quest). Ersetzt ALLE bisherigen Quests
  // und Kategorien unwiderruflich — erkennbar an questsResetV2, läuft nur einmal pro Stand.
  if (!merged.questsResetV2) {
    merged.quests = DEFAULT_QUESTS.slice().map(q => Object.assign({}, q));
    merged.questCategories = DEFAULT_QUEST_CATEGORIES.slice();
    merged.deletedDefaultQuestIds = [];
    merged.questsResetV2 = true;
  }

  // Kategorien-Liste nachrüsten, falls aus einer Vor-Kategorien-Version geladen.
  if (!Array.isArray(merged.questCategories) || merged.questCategories.length === 0) {
    merged.questCategories = DEFAULT_QUEST_CATEGORIES.slice();
  }

  // Jeder Quest eine Kategorie zuordnen, falls sie (aus einer alten Version) fehlt.
  let quests = (Array.isArray(merged.quests) ? merged.quests : DEFAULT_QUESTS.slice()).map(q => {
    if (q.category) return q;
    const match = DEFAULT_QUESTS.find(dq => dq.id === q.id);
    return Object.assign({}, q, { category: match ? match.category : 'Sonstiges' });
  });

  // Neue Standard-Quests ergänzen — aber nur, wenn sie nicht vom Nutzer bewusst gelöscht wurden.
  // Gelöschte Default-Quest-IDs werden in deletedDefaultQuestIds gespeichert.
  if (!Array.isArray(merged.deletedDefaultQuestIds)) merged.deletedDefaultQuestIds = [];
  const deletedSet = new Set(merged.deletedDefaultQuestIds);
  const existingIds = new Set(quests.map(q => q.id));
  DEFAULT_QUESTS.forEach(dq => {
    if (!existingIds.has(dq.id) && !deletedSet.has(dq.id)) quests.push(Object.assign({}, dq));
  });
  merged.quests = quests;

  const usedCategories = new Set(merged.quests.map(q => q.category));
  usedCategories.forEach(c => { if (!merged.questCategories.includes(c)) merged.questCategories.push(c); });

  if (!Array.isArray(merged.calendarItems)) merged.calendarItems = [];

  // Alte Shop-/Inventar-/Power-Up-Felder aus früher gespeicherten Ständen entfernen —
  // diese Features gibt es nicht mehr, die Felder sollen nicht ewig mitgeschleppt werden.
  delete merged.shop;
  delete merged.sharedInventory;
  delete merged.pendingConfirmations;
  delete merged.deletedDefaultShopIds;

  // Profile: fehlende neuere Felder aus freshProfile() auffüllen, alte Cap-Felder entfernen.
  merged.profiles = (Array.isArray(merged.profiles) ? merged.profiles : []).map(p => {
    const fresh = Object.assign(freshProfile(), p);
    delete fresh.streakFreezes;
    delete fresh.streakFreezeUsedDates;
    delete fresh.doubleXpDate;
    delete fresh.actionsToday;
    delete fresh.actionsGrantedFor;
    delete fresh.questXpToday;
    return fresh;
  });

  // Combat-Unterobjekt defensiv zusammenführen, falls dort künftig neue Felder dazukommen.
  merged.combat = Object.assign({}, base.combat, loaded.combat || {});

  return merged;
}

function getClass(profile) { return CLASSES[profile.classKey] || CLASSES.krieger; }

function teamHpMax(state) {
  if (state.profiles.length === 0) return 100;
  if (state.profiles.length === 1) return getClass(state.profiles[0]).teamHp;
  const [a, b] = state.profiles;
  return getClass(a).teamHp + getClass(b).teamHp;
}

// Verdiente Kampf-Aktionen heute — vollständig aus der Anzahl der heute abgeschlossenen
// Quests abgeleitet (Fibonacci-Schwellen), keine eigene Buchführung nötig.
function getActionsEarnedToday(profile) {
  const today = todayBerlin();
  const progress = profile.questProgress[today] || {};
  const completedCount = Object.values(progress).filter(v => v === 'komplett').length;
  return actionsEarnedForQuestCount(completedCount);
}

function getActionsSpentToday(profile) {
  const today = todayBerlin();
  return profile.actionsSpent && profile.actionsSpent.date === today ? profile.actionsSpent.count : 0;
}

// Verdiente, aber noch nicht für eine Fähigkeit eingesetzte Aktionen.
function getAvailableActions(profile) {
  return Math.max(0, getActionsEarnedToday(profile) - getActionsSpentToday(profile));
}

function unlockedAbilities(profile) {
  const cls = getClass(profile);
  const today = todayBerlin();
  return cls.abilities
    .filter(a => profile.level >= a.unlockLevel)
    .map(a => {
      const onCooldown = a.cooldownDays && profile.cooldowns && profile.cooldowns[a.id] === today;
      return Object.assign({}, a, { onCooldown });
    });
}

function addLog(state, text) {
  state.log = [{ id: uid('log'), ts: Date.now(), text }, ...state.log].slice(0, 60);
}

// Vergibt XP an ein Profil, behandelt dabei Level-Ups (auch mehrfach in Folge).
// Jedes Level-Up gibt zusätzlich einen Ability-Upgrade-Punkt — unabhängig von den
// Streak-Meilenstein-Punkten, daher wird NUR abilityUpgradePoints erhöht, nicht
// streakUpgradePointsEarned (das bleibt einzig für die Streak-Fortschrittsanzeige reserviert).
function grantXp(profile, amount) {
  profile.xp += amount;
  while (profile.xp >= xpForLevel(profile.level)) {
    profile.xp -= xpForLevel(profile.level);
    profile.level += 1;
    profile.abilityUpgradePoints = (profile.abilityUpgradePoints || 0) + 1;
  }
}

// Kehrt grantXp() um — zieht XP wieder ab und macht dabei nötigenfalls auch
// Level-Ups rückgängig (mehrfach in Folge, falls nötig). Geht nie unter Level 1.
// Der beim Level-Up vergebene Ability-Punkt wird nur zurückgenommen, falls er noch
// nicht ausgegeben wurde (das Guthaben geht dabei nie unter 0).
function revokeXp(profile, amount) {
  profile.xp -= amount;
  while (profile.xp < 0 && profile.level > 1) {
    profile.level -= 1;
    profile.xp += xpForLevel(profile.level);
    profile.abilityUpgradePoints = Math.max(0, (profile.abilityUpgradePoints || 0) - 1);
  }
  if (profile.xp < 0) profile.xp = 0; // Sicherheitsnetz auf Level 1
}

/* ----- Kalender: Aufgaben & Termine ----- */

function addDaysToDateStr(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function daysBetweenDateStrs(a, b) {
  const da = new Date(a + 'T00:00:00');
  const db = new Date(b + 'T00:00:00');
  return Math.round((db - da) / 86400000);
}

// Sortierlogik für Tagesblick und Heute-Karte:
// 1. Überfällige Aufgaben (overdue > 0) — älteste zuerst (kleinste scheduledDate oben)
// 2. Offene Aufgaben (nicht überfällig) — mit Uhrzeit zuerst (aufsteigend), dann ganztägig
// 3. Termine — mit Uhrzeit zuerst (aufsteigend), dann ganztägig
// 4. Erledigte Aufgaben ganz unten
function sortAgendaEntries(entries) {
  return entries.slice().sort((a, b) => {
    const tierOf = (e) => {
      if (e.done) return 3;
      if (e.item.kind === 'aufgabe' && e.overdue > 0) return 0;
      if (e.item.kind === 'aufgabe') return 1;
      return 2; // Termin
    };
    const ta = tierOf(a), tb = tierOf(b);
    if (ta !== tb) return ta - tb;
    // Innerhalb Tier 0 (überfällig): älteste scheduledDate zuerst, bei gleichem Datum Uhrzeit aufsteigend
    if (ta === 0) {
      if (a.scheduledDate !== b.scheduledDate) return a.scheduledDate < b.scheduledDate ? -1 : 1;
      const aHasTime = !!a.item.time, bHasTime = !!b.item.time;
      if (aHasTime !== bHasTime) return aHasTime ? -1 : 1;
      if (aHasTime && bHasTime) return a.item.time < b.item.time ? -1 : a.item.time > b.item.time ? 1 : 0;
      return 0;
    }
    // Innerhalb anderer Tiers: Uhrzeit aufsteigend, danach ganztägig
    const aHasTime = !!a.item.time, bHasTime = !!b.item.time;
    if (aHasTime !== bHasTime) return aHasTime ? -1 : 1;
    if (aHasTime && bHasTime) return a.item.time < b.item.time ? -1 : a.item.time > b.item.time ? 1 : 0;
    return 0;
  });
}

// Mo=0 .. So=6, passend zur bestehenden Konvention im Kalender-Grid.
function weekdayOfDateStr(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return (d.getDay() + 6) % 7;
}

function addDays(dateStr, n) {
  // WICHTIG: toISOString() würde bei positiver UTC-Differenz (z. B. Berlin/CEST) das
  // Datum einen Tag zu früh zurückgeben, da es lokale Mitternacht in UTC umrechnet
  // und dabei über die Tagesgrenze rutscht. Stattdessen konsequent lokale Getter nutzen.
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function daysUntil(dateStr) {
  const today = todayBerlin();
  const d1 = new Date(today + 'T00:00:00');
  const d2 = new Date(dateStr + 'T00:00:00');
  return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
}

function deadlineLabel(dateStr) {
  const n = daysUntil(dateStr);
  if (n < 0) return null; // abgelaufen
  if (n === 0) return 'Heute!';
  if (n === 1) return 'Noch 1 Tag';
  return `Noch ${n} Tage`;
}

function formatShortDate(dateStr) {
  const [, m, d] = dateStr.split('-');
  return `${d}.${m}.`;
}

function formatShortDateWithYear(dateStr) {
  const [y, m, d] = dateStr.split('-');
  return `${d}.${m}.${y}`;
}

// --- "Zum Handy-Kalender hinzufügen" (.ics-Export) ---------------------
// Erzeugt eine Standard-Kalenderdatei für EIN konkretes Vorkommen eines
// Termins/einer Aufgabe. Bei Uhrzeit wird zusätzlich eine Erinnerung
// (VALARM) eingebettet, damit das Handy-Betriebssystem selbst benachrichtigt
// — TeamQuest muss dafür nicht geöffnet sein.
// Öffnet Google Calendar direkt mit einem vorausgefüllten Termin —
// zuverlässiger auf Android als ein .ics-Datei-Download, weil kein
// Datei-Manager oder MIME-Typ-Zuordnung benötigt wird.
function exportItemToCalendar(item, scheduledDate) {
  const pad = n => String(n).padStart(2, '0');
  let dates;
  if (!item.time) {
    // Ganztägig: YYYYMMDD/YYYYMMDD (End-Tag exklusiv, also +1 Tag)
    const startD = scheduledDate.replace(/-/g, '');
    const endObj = new Date(scheduledDate + 'T00:00:00');
    endObj.setDate(endObj.getDate() + 1);
    const endD = `${endObj.getFullYear()}${pad(endObj.getMonth() + 1)}${pad(endObj.getDate())}`;
    dates = `${startD}/${endD}`;
  } else {
    // Mit Uhrzeit: YYYYMMDDTHHmmss/YYYYMMDDTHHmmss
    const startObj = new Date(`${scheduledDate}T${item.time}:00`);
    const endObj = new Date(startObj.getTime() + (item.durationMinutes || 60) * 60000);
    const fmt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    dates = `${fmt(startObj)}/${fmt(endObj)}`;
  }
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: item.title || '',
    dates,
    ...(item.reminderMinutes && item.time ? { trp: 'false' } : {}),
  });
  window.open(`https://calendar.google.com/calendar/render?${params.toString()}`, '_blank');
}

// Wertet das Sport-Tracking-Protokoll eines Profils aus: Protein pro kg
// Körpergewicht und Kalorien (jeweils Ø letzte 7 Tage) sowie den
// Gewichtsverlauf der letzten 30 Tage für die Grafik.
function computeSportAnalysis(profile) {
  const today = todayBerlin();
  const weekStart = addDaysToDateStr(today, -6);
  const sportLog = profile.sportLog || {};

  let proteinSum = 0, proteinDays = 0;
  let caloriesSum = 0, caloriesDays = 0;
  let weightSumWeek = 0, weightDaysWeek = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDaysToDateStr(weekStart, i);
    const entry = sportLog[d];
    if (!entry) continue;
    if (entry.protein != null) { proteinSum += entry.protein; proteinDays++; }
    if (entry.calories != null) { caloriesSum += entry.calories; caloriesDays++; }
    if (entry.weight != null) { weightSumWeek += entry.weight; weightDaysWeek++; }
  }
  const avgProtein = proteinDays > 0 ? proteinSum / proteinDays : null;
  const avgCalories = caloriesDays > 0 ? caloriesSum / caloriesDays : null;

  // Repräsentatives Gewicht für die Protein/kg-Berechnung: Ø dieser Woche,
  // sonst der letzte davor bekannte Wert (falls diese Woche nichts erfasst wurde).
  let representativeWeight = weightDaysWeek > 0 ? weightSumWeek / weightDaysWeek : null;
  if (representativeWeight == null) {
    const priorDates = Object.keys(sportLog).filter(d => d < weekStart && sportLog[d].weight != null).sort();
    if (priorDates.length > 0) representativeWeight = sportLog[priorDates[priorDates.length - 1]].weight;
  }
  const proteinPerKg = (avgProtein != null && representativeWeight) ? avgProtein / representativeWeight : null;

  const chartStart = addDaysToDateStr(today, -29);
  const weightSeries = Object.keys(sportLog)
    .filter(d => d >= chartStart && d <= today && sportLog[d].weight != null)
    .sort()
    .map(d => ({ date: d, weight: sportLog[d].weight }));

  return { avgProtein, avgCalories, proteinPerKg, representativeWeight, weightSeries, proteinDays, caloriesDays };
}

// Trainings-Minuten aus abgeschlossenen Sport-Quests (letzte 7 Tage) — gruppiert
// nach Titel (Cardio/Krafttraining/eigene), damit auch künftige eigene Sport-Quests
// automatisch mitlaufen, ohne fest verdrahtet zu sein.
function computeWorkoutAnalysis(profile) {
  const today = todayBerlin();
  const weekStart = addDaysToDateStr(today, -6);
  const log = profile.sportQuestLog || {};
  const byType = {};
  const recent = [];
  for (let i = 0; i < 7; i++) {
    const d = addDaysToDateStr(weekStart, i);
    (log[d] || []).forEach(e => {
      byType[e.title] = (byType[e.title] || 0) + (e.minutes || 0);
      recent.push(Object.assign({ date: d }, e));
    });
  }
  recent.sort((a, b) => b.ts - a.ts);
  const totalMinutes = Object.values(byType).reduce((s, v) => s + v, 0);
  return { byType, totalMinutes, recent: recent.slice(0, 10) };
}

function weekdayLabelFor(dateStr) {
  return WEEKDAY_LABELS[weekdayOfDateStr(dateStr)];
}

// Berechnet alle geplanten Vorkommen eines Kalender-Eintrags innerhalb [fromDate, toDate],
// basierend auf der Wiederholungsregel (oder einmalig, falls keine Regel gesetzt ist).
function getOccurrencesInRange(item, fromDate, toDate) {
  if (!item.date || fromDate > toDate) return [];
  const rec = item.recurrence;
  const results = [];

  if (!rec) {
    if (item.date >= fromDate && item.date <= toDate) results.push(item.date);
    return results;
  }

  if (rec.type === 'weekly') {
    let cursor = item.date > fromDate ? item.date : fromDate;
    let guard = 0;
    while (cursor <= toDate && guard < 730) {
      if (cursor >= item.date && rec.weekdays.includes(weekdayOfDateStr(cursor))) {
        results.push(cursor);
      }
      cursor = addDaysToDateStr(cursor, 1);
      guard++;
    }
  } else if (rec.type === 'monthly') {
    let [y, m] = fromDate.split('-').map(Number);
    const [toY, toM] = toDate.split('-').map(Number);
    let guard = 0;
    while ((y < toY || (y === toY && m <= toM)) && guard < 120) {
      const lastDay = new Date(y, m, 0).getDate();
      const day = Math.min(rec.day, lastDay);
      const dateStr = `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      if (dateStr >= item.date && dateStr >= fromDate && dateStr <= toDate) results.push(dateStr);
      m += 1;
      if (m > 12) { m = 1; y += 1; }
      guard++;
    }
  } else if (rec.type === 'yearly') {
    let [y] = fromDate.split('-').map(Number);
    const toY = Number(toDate.split('-')[0]);
    let guard = 0;
    while (y <= toY + 1 && guard < 50) {
      const lastDay = new Date(y, rec.month, 0).getDate();
      const day = Math.min(rec.day, lastDay);
      const dateStr = `${y}-${String(rec.month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      if (dateStr >= item.date && dateStr >= fromDate && dateStr <= toDate) results.push(dateStr);
      y += 1;
      guard++;
    }
  }
  return results;
}

function isOccurrenceDone(item, scheduledDate) {
  return !!(item.occurrences && item.occurrences[scheduledDate] && item.occurrences[scheduledDate].done);
}

// Effektives Datum eines Vorkommens: Termine verschieben sich nie. Aufgaben mit
// "Mitnehmen" rutschen auf "heute", solange sie nicht erledigt sind. Ohne
// "Mitnehmen" bleiben sie an ihrem ursprünglichen Tag stehen.
function getEffectiveDate(item, scheduledDate, today) {
  if (item.kind !== 'aufgabe') return scheduledDate;
  if (isOccurrenceDone(item, scheduledDate)) return scheduledDate;
  if (item.carryForward && scheduledDate < today) return today;
  return scheduledDate;
}

function overdueDaysFor(item, scheduledDate, today) {
  if (item.kind !== 'aufgabe' || isOccurrenceDone(item, scheduledDate) || scheduledDate >= today) return 0;
  return daysBetweenDateStrs(scheduledDate, today);
}

// Ein Eintrag ist sichtbar, wenn er nicht als "privat" markiert ist, oder wenn
// die anschauende Person selbst der/die Ersteller(in) ist. Einträge ohne
// visibility-Feld (alte Daten) gelten automatisch als geteilt.
function isItemVisibleTo(item, viewerProfileId) {
  return item.visibility !== 'private' || item.creatorId === viewerProfileId;
}

// Agenda für einen beliebigen Tag `day` (kann heute, in der Vergangenheit oder
// Zukunft liegen): alles, was an diesem Tag fällig ist (inkl. mitgenommener
// überfälliger Aufgaben, die heute landen) sowie alles, was an diesem Tag
// tatsächlich erledigt wurde. `today` bleibt für Mitnehmen-/Überfällig-Logik
// immer das echte heutige Datum, unabhängig von `day`.
function getDayAgenda(state, day, today, viewerProfileId) {
  const out = [];
  const scanTo = day > today ? day : today;
  (state.calendarItems || []).filter(item => isItemVisibleTo(item, viewerProfileId)).forEach(item => {
    getOccurrencesInRange(item, item.date, scanTo).forEach(sched => {
      const occ = item.occurrences && item.occurrences[sched];
      const done = !!(occ && occ.done);
      if (done) {
        if (occ.doneDate === day) out.push({ item, scheduledDate: sched, done: true, overdue: 0 });
        return;
      }
      const eff = getEffectiveDate(item, sched, today);
      if (eff === day) {
        out.push({ item, scheduledDate: sched, done: false, overdue: overdueDaysFor(item, sched, today) });
      }
    });
  });
  return out;
}

// Heutige Agenda (Spezialfall von getDayAgenda mit day = today) — bleibt für
// den Quests-Tab unverändert immer an das echte heutige Datum gebunden.
function getTodayAgenda(state, today, viewerProfileId) {
  return getDayAgenda(state, today, today, viewerProfileId);
}

// Vorschau der nächsten `daysAhead` Tage (rein informativ, nicht abhakbar).
function getUpcomingAgenda(state, today, daysAhead, viewerProfileId) {
  const fromDate = addDaysToDateStr(today, 1);
  const toDate = addDaysToDateStr(today, daysAhead);
  const out = [];
  (state.calendarItems || []).filter(item => isItemVisibleTo(item, viewerProfileId)).forEach(item => {
    getOccurrencesInRange(item, fromDate, toDate).forEach(sched => {
      out.push({ item, scheduledDate: sched, done: isOccurrenceDone(item, sched) });
    });
  });
  out.sort((a, b) => (a.scheduledDate < b.scheduledDate ? -1 : a.scheduledDate > b.scheduledDate ? 1 : 0));
  return out;
}

// Ordnet alle Vorkommen im sichtbaren Monat ihrem tatsächlichen Anzeige-Tag zu:
// erledigte Aufgaben erscheinen am Tag, an dem sie ERLEDIGT wurden (nicht am
// ursprünglich geplanten Tag) — offene Aufgaben/Termine am effektiven Tag
// (heute, falls mitgenommen und überfällig; sonst am geplanten Tag).
function getMonthAgenda(state, monthStart, monthEnd, today, viewerProfileId) {
  const byDate = {};
  const scanTo = monthEnd > today ? monthEnd : today;
  (state.calendarItems || []).filter(item => isItemVisibleTo(item, viewerProfileId)).forEach(item => {
    getOccurrencesInRange(item, item.date, scanTo).forEach(sched => {
      const occ = item.occurrences && item.occurrences[sched];
      const done = !!(occ && occ.done);
      const displayDate = done ? occ.doneDate : getEffectiveDate(item, sched, today);
      if (displayDate >= monthStart && displayDate <= monthEnd) {
        (byDate[displayDate] = byDate[displayDate] || []).push({ item, scheduledDate: sched, done });
      }
    });
  });
  return byDate;
}

// Protokoll: alle jemals erledigten Aufgaben-Vorkommen, neueste zuerst (nach Erledigungs-Datum).
function getCompletionLog(state, limit, viewerProfileId) {
  const out = [];
  (state.calendarItems || []).filter(item => isItemVisibleTo(item, viewerProfileId)).forEach(item => {
    if (item.kind !== 'aufgabe' || !item.occurrences) return;
    Object.keys(item.occurrences).forEach(sched => {
      const occ = item.occurrences[sched];
      if (occ && occ.done && occ.doneDate) {
        out.push({ item, scheduledDate: sched, doneDate: occ.doneDate, doneBy: occ.doneBy });
      }
    });
  });
  out.sort((a, b) => (a.doneDate < b.doneDate ? 1 : a.doneDate > b.doneDate ? -1 : 0));
  return typeof limit === 'number' ? out.slice(0, limit) : out;
}

// Aufgabe (nicht Termin) als erledigt markieren. Gibt 5 XP, gedeckelt bei 10 XP/Tag
// pro Profil; darüber hinaus wird trotzdem als erledigt protokolliert (nur ohne XP).
function completeCalendarItem(state, profileId, itemId, scheduledDate) {
  const item = (state.calendarItems || []).find(i => i.id === itemId);
  const profile = state.profiles.find(p => p.id === profileId);
  if (!item || !profile || item.kind !== 'aufgabe') return { xpGained: 0 };
  if (!item.occurrences) item.occurrences = {};
  if (item.occurrences[scheduledDate] && item.occurrences[scheduledDate].done) return { xpGained: 0 };

  const today = todayBerlin();
  if (!profile.calendarXpToday || profile.calendarXpToday.date !== today) {
    profile.calendarXpToday = { date: today, amount: 0 };
  }
  const headroom = Math.max(0, CALENDAR_XP_DAILY_CAP - profile.calendarXpToday.amount);
  const gained = Math.min(CALENDAR_XP_PER_TASK, headroom);

  item.occurrences[scheduledDate] = { done: true, doneDate: today, doneBy: profile.id, xpGained: gained };
  if (gained > 0) {
    grantXp(profile, gained);
    profile.calendarXpToday.amount += gained;
  }
  addLog(state, gained > 0
    ? `📅 ${profile.name} erledigt „${item.title}" — +${gained} XP.`
    : `📅 ${profile.name} erledigt „${item.title}" (Tages-XP-Limit erreicht).`);
  return { xpGained: gained };
}

// Macht ein erledigtes Aufgaben-Vorkommen rückgängig ("verklickt"): nimmt genau
// die dafür vergebene XP zurück (egal ob heute oder an einem früheren Tag
// erledigt) und entfernt den Erledigt-Status wieder.
function uncompleteCalendarItem(state, profileId, itemId, scheduledDate) {
  const item = (state.calendarItems || []).find(i => i.id === itemId);
  const profile = state.profiles.find(p => p.id === profileId);
  if (!item || !profile || item.kind !== 'aufgabe') return { ok: false };
  const occ = item.occurrences && item.occurrences[scheduledDate];
  if (!occ || !occ.done) return { ok: false };

  const gained = occ.xpGained || 0;
  if (gained > 0) {
    revokeXp(profile, gained);
    if (profile.calendarXpToday && profile.calendarXpToday.date === occ.doneDate) {
      profile.calendarXpToday.amount = Math.max(0, profile.calendarXpToday.amount - gained);
    }
  }
  delete item.occurrences[scheduledDate];

  addLog(state, `↩️ ${profile.name}: „${item.title}" rückgängig gemacht${gained > 0 ? ` — -${gained} XP` : ''}.`);
  return { ok: true, xpRevoked: gained };
}

// Schadens-/Heileffekt auf den Boss anwenden, inkl. Sieg-Check.
// Gibt zurück, ob der Boss in diesem Schritt besiegt wurde.
function dealBossDamage(state, amount) {
  state.combat.bossHp = Math.max(0, state.combat.bossHp - amount);
  if (state.combat.bossHp <= 0) {
    defeatBoss(state);
    return true;
  }
  return false;
}

function defeatBoss(state) {
  const stats = bossStatsForTier(state.combat.bossTier);

  // Proportionale Gold-Verteilung basierend auf Aktions-Beiträgen.
  const contributions = state.combat.actionContributions || {};
  const total = Object.values(contributions).reduce((s, n) => s + n, 0);
  let distributed = 0;
  const profilesSorted = [...state.profiles].sort((a, b) => (contributions[b.id] || 0) - (contributions[a.id] || 0));

  profilesSorted.forEach((p, i) => {
    let share;
    if (total === 0) {
      // Niemand hat mitgekämpft (sollte nicht vorkommen) → gleich aufteilen
      share = Math.floor(stats.gold / state.profiles.length);
    } else if (i === profilesSorted.length - 1) {
      // Letztes Profil bekommt den Rest (verhindert Rundungsverlust)
      share = stats.gold - distributed;
    } else {
      share = Math.round(stats.gold * (contributions[p.id] || 0) / total);
    }
    p.gold += share;
    distributed += share;
    addLog(state, `💰 ${p.name}: +${share} G (${total > 0 ? Math.round((contributions[p.id] || 0) / total * 100) : 50}% Beitrag, ${contributions[p.id] || 0} Aktionen).`);
  });

  addLog(state, `🏆 ${bossDisplayName(state.combat.bossTier)} besiegt! ${stats.gold} G anteilsmäßig verteilt.`);

  // Höchsten besiegten Tier aktualisieren
  if (state.combat.maxTierDefeated == null || state.combat.bossTier > state.combat.maxTierDefeated) {
    state.combat.maxTierDefeated = state.combat.bossTier;
  }

  // Nächster Boss zufällig aus freigeschalteten Tiers
  const maxAvailable = Math.min(state.combat.maxTierDefeated + 1, BOSS_TIERS.length - 1);
  const nextTier = Math.floor(Math.random() * (maxAvailable + 1));
  state.combat.bossTier = nextTier;

  const next = bossStatsForTier(nextTier);
  state.combat.bossHp = next.hp;
  state.combat.teamHp = teamHpMax(state);
  state.combat.pendingShield = 0;
  state.combat.bleeds = [];
  state.combat.actionContributions = {}; // Reset für den nächsten Boss
  addLog(state, `⚔️ Nächster Gegner: ${next.emoji} ${next.name}!`);
}

// Schaden auf die Team-HP anwenden, inkl. "Boss heilt sich bei 0 HP"-Regel.
function dealTeamDamage(state, amount) {
  const reduced = Math.max(0, amount - state.combat.pendingShield);
  if (state.combat.pendingShield > 0) {
    addLog(state, `🛡️ Schild reduziert den Gegenangriff um ${Math.min(amount, state.combat.pendingShield)}.`);
    state.combat.pendingShield = 0;
  }
  state.combat.teamHp = Math.max(0, state.combat.teamHp - reduced);
  if (reduced > 0) addLog(state, `💥 Gegenangriff: -${reduced} Team-HP.`);
  if (state.combat.teamHp <= 0) {
    const stats = bossStatsForTier(state.combat.bossTier);
    const healAmount = Math.round(stats.hp * 0.15);
    state.combat.bossHp = Math.min(stats.hp, state.combat.bossHp + healAmount);
    state.combat.teamHp = teamHpMax(state);
    addLog(state, `☠️ Team-HP auf 0 gefallen — der Boss heilt sich um ${healAmount} HP, eure Team-HP wird komplett aufgefüllt.`);
  }
}

function tickBleeds(state) {
  if (!state.combat.bleeds.length) return;
  let totalTick = 0;
  state.combat.bleeds = state.combat.bleeds.filter(b => {
    totalTick += b.dmg;
    b.remaining -= 1;
    return b.remaining > 0;
  });
  if (totalTick > 0) {
    addLog(state, `🩸 Blutung: ${totalTick} Schaden am Boss.`);
    dealBossDamage(state, totalTick);
  }
}

// Eine Fähigkeit einsetzen (kostet eine der heute verdienten, noch nicht
// verbrauchten Kampf-Aktionen). Wird jetzt direkt im Kampf-Tab ausgelöst,
// nicht mehr automatisch nach Quest-Abschluss.
function useAbility(state, profileId, abilityId) {
  const profile = state.profiles.find(p => p.id === profileId);
  if (!profile) return { ok: false, reason: 'unknown' };
  const cls = getClass(profile);
  const ability = cls.abilities.find(a => a.id === abilityId);
  if (!ability) return { ok: false, reason: 'unknown' };

  if (profile.level < ability.unlockLevel) return { ok: false, reason: 'locked' };

  const today = todayBerlin();
  if (ability.cooldownDays && profile.cooldowns && profile.cooldowns[ability.id] === today) {
    return { ok: false, reason: 'cooldown' };
  }
  if (getAvailableActions(profile) <= 0) return { ok: false, reason: 'no_actions' };

  // Aktion verbrauchen.
  if (!profile.actionsSpent || profile.actionsSpent.date !== today) profile.actionsSpent = { date: today, count: 0 };
  profile.actionsSpent.count += 1;

  // Anteil am Boss-Kampf vermerken (Basis für proportionale Gold-Verteilung beim Sieg).
  if (!state.combat.actionContributions) state.combat.actionContributions = {};
  state.combat.actionContributions[profileId] = (state.combat.actionContributions[profileId] || 0) + 1;

  // Blutungs-Ticks aus VORHERIGEN Aktionen zuerst auflösen.
  tickBleeds(state);
  if (state.combat.bossHp <= 0) return { ok: true }; // Boss ist durch die Blutung gerade gefallen

  if (ability.cooldownDays) {
    profile.cooldowns = profile.cooldowns || {};
    profile.cooldowns[ability.id] = today;
  }

  let defeated = false;
  const bonus = (profile.abilityUpgrades || {})[abilityId] || 0; // Upgrade-Bonus (aus Streak-Meilensteinen)
  switch (ability.kind) {
    case 'damage': {
      const dmg = rollVariance(ability.value) + bonus;
      addLog(state, `⚔️ ${profile.name} setzt ${ability.name} ein: ${dmg} Schaden${bonus ? ` (+${bonus})` : ''}.`);
      defeated = dealBossDamage(state, dmg);
      break;
    }
    case 'damage_bleed': {
      const dmg = rollVariance(ability.value) + bonus;
      addLog(state, `🩸 ${profile.name} setzt ${ability.name} ein: ${dmg} Schaden${bonus ? ` (+${bonus})` : ''} + Blutung.`);
      defeated = dealBossDamage(state, dmg);
      if (!defeated) state.combat.bleeds.push({ remaining: ability.bleedTicks, dmg: ability.bleedValue });
      break;
    }
    case 'shield': {
      const shv = ability.shieldValue + bonus;
      state.combat.pendingShield = Math.max(state.combat.pendingShield, shv);
      addLog(state, `🛡️ ${profile.name} setzt ${ability.name} ein: nächster Gegenangriff -${shv}${bonus ? ` (+${bonus})` : ''}.`);
      break;
    }
    case 'damage_shield': {
      const dmg = rollVariance(ability.value) + bonus;
      state.combat.pendingShield = Math.max(state.combat.pendingShield, ability.shieldValue);
      addLog(state, `❄️ ${profile.name} setzt ${ability.name} ein: ${dmg} Schaden${bonus ? ` (+${bonus})` : ''}, nächster Gegenangriff -${ability.shieldValue}.`);
      defeated = dealBossDamage(state, dmg);
      break;
    }
    case 'damage_selfhurt': {
      const dmg = rollVariance(ability.value) + bonus;
      addLog(state, `💢 ${profile.name} setzt ${ability.name} ein: ${dmg} Schaden${bonus ? ` (+${bonus})` : ''}, kostet ${ability.selfHurt} Team-HP.`);
      defeated = dealBossDamage(state, dmg);
      if (!defeated) dealTeamDamage(state, ability.selfHurt);
      break;
    }
    case 'heal': {
      const healAmt = ability.value + bonus;
      const before = state.combat.teamHp;
      state.combat.teamHp = Math.min(teamHpMax(state), state.combat.teamHp + healAmt);
      addLog(state, `✨ ${profile.name} setzt ${ability.name} ein: +${state.combat.teamHp - before} Team-HP${bonus ? ` (+${bonus})` : ''}.`);
      break;
    }
    case 'damage_heal': {
      const dmg = rollVariance(ability.value) + bonus;
      const healAmt = ability.healValue + bonus;
      const before = state.combat.teamHp;
      state.combat.teamHp = Math.min(teamHpMax(state), state.combat.teamHp + healAmt);
      addLog(state, `🙏 ${profile.name} setzt ${ability.name} ein: ${dmg} Schaden + ${state.combat.teamHp - before} Heilung${bonus ? ` (+${bonus} je)` : ''}.`);
      defeated = dealBossDamage(state, dmg);
      break;
    }
    case 'random_damage_heal': {
      if (Math.random() < 0.5) {
        const healAmt = ability.value + bonus;
        const before = state.combat.teamHp;
        state.combat.teamHp = Math.min(teamHpMax(state), state.combat.teamHp + healAmt);
        addLog(state, `🌟 ${profile.name} setzt ${ability.name} ein: +${state.combat.teamHp - before} Heilung${bonus ? ` (+${bonus})` : ''}.`);
      } else {
        const dmg = ability.value + bonus;
        addLog(state, `🌟 ${profile.name} setzt ${ability.name} ein: ${dmg} Schaden${bonus ? ` (+${bonus})` : ''}.`);
        defeated = dealBossDamage(state, dmg);
      }
      break;
    }
  }

  if (!defeated) {
    // Gegenangriff-Timing: alle 2 kumulierte Aktionen (über beide Profile).
    if (state.combat.actionsTodayDate !== today) {
      state.combat.actionsTodayDate = today;
      state.combat.actionsTodayCount = 0;
    }
    state.combat.actionsTodayCount += 1;
    if (state.combat.actionsTodayCount % 2 === 0) {
      dealTeamDamage(state, counterDamageForTier(state.combat.bossTier));
    }
  }

  return { ok: true };
}

// Aktuelle Streak rein aus der Quest-Historie ableiten (questProgress) — keine eigene
// Buchführung nötig, dadurch bleibt sie immer exakt synchron, auch bei Rückgängig-Machen.
function computeStreak(profile) {
  const progress = profile.questProgress || {};
  const hasEntries = d => progress[d] && Object.keys(progress[d]).length > 0;
  let date = todayBerlin();
  // Heute noch nichts erledigt? Dann ist die Streak noch nicht gebrochen, aber auch noch
  // nicht verlängert — Rückwärtslauf beginnt bei gestern.
  if (!hasEntries(date)) date = addDays(date, -1);
  let streak = 0;
  while (hasEntries(date)) {
    streak++;
    date = addDays(date, -1);
  }
  return streak;
}

// Längste je erreichte Streak — ebenfalls vollständig aus der Historie abgeleitet.
function computeBestStreak(profile) {
  const progress = profile.questProgress || {};
  const dates = Object.keys(progress).filter(d => progress[d] && Object.keys(progress[d]).length > 0).sort();
  if (dates.length === 0) return 0;
  let best = 1, current = 1;
  for (let i = 1; i < dates.length; i++) {
    current = (addDays(dates[i - 1], 1) === dates[i]) ? current + 1 : 1;
    best = Math.max(best, current);
  }
  return best;
}

// ============================================================
// ARBEITSZEITERFASSUNG — Hilfsfunktionen
// ============================================================

// Ostersonntag (Gaußscher Algorithmus)
function easterSunday(year) {
  const a = year%19, b = Math.floor(year/100), c = year%100;
  const d = Math.floor(b/4), e = b%4, f = Math.floor((b+8)/25);
  const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15)%30;
  const i = Math.floor(c/4), k = c%4, l = (32+2*e+2*i-h-k)%7;
  const m = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m+114)/31);
  const day = ((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}

function rlpHolidaysForYear(year) {
  const e = easterSunday(year);
  const fmt = d => { const x = new Date(e.getTime()+d*86400000); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
  return new Set([
    `${year}-01-01`, fmt(-2), fmt(1), `${year}-05-01`,
    fmt(39), fmt(50), fmt(60),
    `${year}-10-03`, `${year}-11-01`,
    `${year}-12-25`, `${year}-12-26`,
  ]);
}

function rlpHolidayName(dateStr) {
  const year = parseInt(dateStr.slice(0,4));
  const e = easterSunday(year);
  const fmt = d => { const x = new Date(e.getTime()+d*86400000); return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`; };
  const map = {
    [`${year}-01-01`]: 'Neujahr',
    [fmt(-2)]: 'Karfreitag',
    [fmt(1)]: 'Ostermontag',
    [`${year}-05-01`]: 'Tag der Arbeit',
    [fmt(39)]: 'Christi Himmelfahrt',
    [fmt(50)]: 'Pfingstmontag',
    [fmt(60)]: 'Fronleichnam',
    [`${year}-10-03`]: 'Tag der deutschen Einheit',
    [`${year}-11-01`]: 'Allerheiligen',
    [`${year}-12-25`]: '1. Weihnachtstag',
    [`${year}-12-26`]: '2. Weihnachtstag',
  };
  return map[dateStr] || null;
}

// Arbeitstage zählen — nur Wochenenden (laut workDays-Einstellung) raus
function countWorkDays(from, to, work) {
  const workDays = work.workDays || [1,2,3,4,5];
  let count = 0, d = from;
  while (d <= to) {
    const dow = new Date(d + 'T00:00:00').getDay();
    if (workDays.includes(dow)) count++;
    d = addDays(d, 1);
  }
  return count;
}

function isHolidayToday() {
  const today = todayBerlin();
  return rlpHolidaysForYear(parseInt(today.slice(0,4))).has(today);
}

function isWorkDayToday(work) {
  if (isHolidayToday()) return false;
  const day = new Date().getDay();
  return (work.workDays || [1,2,3,4,5]).includes(day);
}

function isSickToday(work) {
  const today = todayBerlin();
  return (work.sickDays || []).some(s => s.from <= today && today <= s.to);
}

function isVacationToday(work) {
  const today = todayBerlin();
  return (work.vacationDays || []).some(v => v.from <= today && today <= v.to);
}

// Prüft für ein beliebiges Datum, ob es ein Soll-Arbeitstag ist
// (Wochentag laut Einstellung, kein Feiertag, kein Urlaub, keine Krankmeldung).
function isRequiredWorkDayOn(work, dateStr) {
  const dow = new Date(dateStr + 'T00:00:00').getDay();
  if (!(work.workDays || [1,2,3,4,5]).includes(dow)) return false;
  if (rlpHolidaysForYear(parseInt(dateStr.slice(0,4))).has(dateStr)) return false;
  if ((work.sickDays || []).some(s => s.from <= dateStr && dateStr <= s.to)) return false;
  if ((work.vacationDays || []).some(v => v.from <= dateStr && dateStr <= v.to)) return false;
  return true;
}

function calcProRatedVacation(work) {
  const total = work.vacationDaysPerYear || 30;
  const start = work.startDate;
  if (!start) return total;
  const today = todayBerlin();
  const year = today.slice(0, 4);
  const yearStart = `${year}-01-01`;
  const yearEnd = `${year}-12-31`;
  const effectiveStart = start > yearStart ? start : yearStart;
  const msDiff = (d1, d2) => new Date(d2 + 'T00:00:00') - new Date(d1 + 'T00:00:00');
  const daysInYear = msDiff(yearStart, yearEnd) / 86400000 + 1;
  const remainingDays = msDiff(effectiveStart, yearEnd) / 86400000 + 1;
  return Math.round((total * (remainingDays / daysInYear)) * 10) / 10;
}

function calcAvailableVacation(work) {
  return Math.max(0, calcProRatedVacation(work) - (work.vacationDaysUsed || 0));
}

function calcCurrentSessionMinutes(work) {
  if (!work.clockedIn || !work.sessionStart) return 0;
  return Math.max(0, (Date.now() - work.sessionStart) / 60000);
}

function formatHM(minutes) {
  const abs = Math.abs(minutes);
  const h = Math.floor(abs / 60);
  const m = Math.floor(abs % 60);
  const sign = minutes < 0 ? '-' : '';
  return `${sign}${h > 0 ? h + 'h ' : ''}${m}min`;
}

function formatTimeHHMM(ts) {
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// Eine Quest-Stufe abschließen. Gibt zurück, ob dadurch eine Kampf-Aktion frei wurde.
// completeQuest: einstufig (kein "kurz" mehr). minutes ist nur für Sport-Quests relevant
// (bestimmt die XP und wird für die Sport-Analyse mitgeschrieben).
function completeQuestStage(state, profileId, questId, minutes = null, date = null) {
  const profile = state.profiles.find(p => p.id === profileId);
  const quest = state.quests.find(q => q.id === questId);
  if (!profile || !quest) return { xpGained: 0, actionGranted: false, leveledUp: false };

  const today = date || todayBerlin();
  if (!profile.questProgress[today]) profile.questProgress[today] = {};
  if (profile.questProgress[today][questId] === 'komplett') {
    return { xpGained: 0, actionGranted: false, leveledUp: false, alreadyDone: true };
  }

  // Kampf-Aktionen vor/nach dieser Erledigung — Basis für "wurde eine neue Aktion freigeschaltet".
  const completedBefore = Object.values(profile.questProgress[today]).filter(v => v === 'komplett').length;
  const actionsBefore = actionsEarnedForQuestCount(completedBefore);

  const isSport = quest.category === SPORT_CATEGORY;
  const gained = isSport ? sportQuestXp(minutes) : REGULAR_QUEST_XP;

  profile.questProgress[today][questId] = 'komplett';

  // Streak-Meilensteine prüfen — Basis ist streakUpgradePointsEarned (wächst nie),
  // nicht abilityUpgradePoints (sinkt beim Ausgeben). So kein doppeltes Vergeben.
  if (today === todayBerlin()) {
    const newStreak = computeStreak(profile);
    let milestonesGained = 0;
    while (newStreak >= nextStreakUpgradeMilestone(profile.streakUpgradePointsEarned || 0)) {
      profile.streakUpgradePointsEarned = (profile.streakUpgradePointsEarned || 0) + 1;
      profile.abilityUpgradePoints = (profile.abilityUpgradePoints || 0) + 1;
      milestonesGained++;
    }
    if (milestonesGained > 0) {
      addLog(state, `🔥 Streak-Meilenstein! +${milestonesGained} Ability-Upgrade-Punkt${milestonesGained > 1 ? 'e' : ''} (Streak: ${newStreak} Tage).`);
    }
  }

  const levelBefore = profile.level;
  grantXp(profile, gained);

  // Tatsächlich vergebene XP pro Quest/Tag mitschreiben — Grundlage für exaktes Rückgängigmachen.
  if (!profile.xpGrantedFor) profile.xpGrantedFor = {};
  if (!profile.xpGrantedFor[today]) profile.xpGrantedFor[today] = {};
  profile.xpGrantedFor[today][questId] = gained;

  // Sport-Quests: Minuten für die Sport-Analyse mitschreiben.
  if (isSport) {
    if (!profile.sportQuestLog) profile.sportQuestLog = {};
    if (!profile.sportQuestLog[today]) profile.sportQuestLog[today] = [];
    profile.sportQuestLog[today].push({ questId, title: quest.title, minutes: Math.max(0, Math.floor(minutes || 0)), xp: gained, ts: Date.now() });
  }

  addLog(state, `📜 ${profile.name}: "${quest.title}" — +${gained} XP${isSport ? ` (${Math.max(0, Math.floor(minutes||0))} Min)` : ''}.`);

  const completedAfter = completedBefore + 1;
  const actionsAfter = actionsEarnedForQuestCount(completedAfter);
  const actionGranted = actionsAfter > actionsBefore;

  return { xpGained: gained, actionGranted, leveledUp: profile.level > levelBefore };
}

// Macht eine heute abgeschlossene Quest rückgängig ("verklickt"): nimmt die dafür
// vergebenen XP zurück, entfernt einen evtl. Sport-Log-Eintrag, und die verdienten
// Kampf-Aktionen sinken automatisch mit (rein aus der Quest-Anzahl abgeleitet) —
// bereits für eine Fähigkeit eingesetzte Aktionen bleiben davon unberührt.
function uncompleteQuestStage(state, profileId, questId) {
  const profile = state.profiles.find(p => p.id === profileId);
  const quest = state.quests.find(q => q.id === questId);
  if (!profile || !quest) return { ok: false };

  const today = todayBerlin();
  const progress = profile.questProgress[today] || {};
  if (progress[questId] !== 'komplett') return { ok: false }; // heute nichts zum Rückgängigmachen vorhanden

  const completedBefore = Object.values(progress).filter(v => v === 'komplett').length;
  const actionsBefore = actionsEarnedForQuestCount(completedBefore);

  const grantedToday = (profile.xpGrantedFor && profile.xpGrantedFor[today] && profile.xpGrantedFor[today][questId]) || 0;
  if (grantedToday > 0) revokeXp(profile, grantedToday);
  if (profile.xpGrantedFor && profile.xpGrantedFor[today]) delete profile.xpGrantedFor[today][questId];

  delete profile.questProgress[today][questId];

  // Zugehörigen Sport-Log-Eintrag von heute entfernen (der zuletzt für diese Quest erfasste).
  if (profile.sportQuestLog && profile.sportQuestLog[today]) {
    const idx = profile.sportQuestLog[today].map(e => e.questId).lastIndexOf(questId);
    if (idx >= 0) profile.sportQuestLog[today].splice(idx, 1);
  }

  const completedAfter = completedBefore - 1;
  const actionsAfter = actionsEarnedForQuestCount(completedAfter);
  const actionRevoked = actionsAfter < actionsBefore && getActionsSpentToday(profile) < actionsBefore;

  addLog(state, `↩️ ${profile.name}: "${quest.title}" rückgängig gemacht${grantedToday > 0 ? ` — -${grantedToday} XP` : ''}.`);

  return { ok: true, xpRevoked: grantedToday, actionRevoked };
}

// Einfacher SVG-Liniengraph für den Körpergewichts-Verlauf (kein externes
// Chart-Paket nötig — die Datei bleibt ein einzelnes, abhängigkeitsfreies HTML).
function WeightChart({ series }) {
  const [activeIdx, setActiveIdx] = useState(null);

  if (series.length < 2) {
    return (
      <div className="bg-surface border border-border rounded-xl p-4 text-xs text-inkDim text-center">
        Noch nicht genug Einträge für einen Verlauf — trag dein Gewicht an mindestens zwei verschiedenen Tagen ein.
      </div>
    );
  }
  const W = 320, H = 170;
  const PAD_L = 36, PAD_R = 12, PAD_T = 14, PAD_B = 26;
  const plotW = W - PAD_L - PAD_R;
  const plotH = H - PAD_T - PAD_B;

  const weights = series.map(p => p.weight);
  const rawMin = Math.min(...weights), rawMax = Math.max(...weights);
  const pad = Math.max(0.5, (rawMax - rawMin) * 0.2);
  const minW = rawMin - pad, maxW = rawMax + pad;
  const range = (maxW - minW) || 1;

  const firstDate = series[0].date, lastDate = series[series.length - 1].date;
  const totalDays = Math.max(1, daysBetweenDateStrs(firstDate, lastDate));

  const points = series.map(p => ({
    x: PAD_L + (daysBetweenDateStrs(firstDate, p.date) / totalDays) * plotW,
    y: PAD_T + plotH - ((p.weight - minW) / range) * plotH,
    weight: p.weight,
    date: p.date,
  }));
  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  const yTicks = [0, 0.5, 1].map(f => minW + f * range);
  const maxLabels = 5;
  const labelStep = Math.max(1, Math.ceil(series.length / maxLabels));
  const xLabelIndices = series.map((_, i) => i).filter(i => i === 0 || i === series.length - 1 || i % labelStep === 0);

  const active = activeIdx != null ? points[activeIdx] : null;

  return (
    <div className="bg-surface border border-border rounded-xl p-3">
      <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto select-none">
        {yTicks.map((val, i) => {
          const y = PAD_T + plotH - ((val - minW) / range) * plotH;
          return (
            <g key={i}>
              <line x1={PAD_L} y1={y} x2={W - PAD_R} y2={y} stroke="#473d57" strokeWidth="1" strokeDasharray="3,3" />
              <text x={PAD_L - 5} y={y + 3} fontSize="8" fill="#a9988a" textAnchor="end">{val.toFixed(1)}</text>
            </g>
          );
        })}
        <line x1={PAD_L} y1={PAD_T + plotH} x2={W - PAD_R} y2={PAD_T + plotH} stroke="#473d57" strokeWidth="1.2" />
        <line x1={PAD_L} y1={PAD_T} x2={PAD_L} y2={PAD_T + plotH} stroke="#473d57" strokeWidth="1.2" />
        {xLabelIndices.map(i => (
          <text key={i} x={points[i].x} y={H - 8} fontSize="8" fill="#a9988a" textAnchor="middle">
            {formatShortDate(series[i].date)}
          </text>
        ))}
        <path d={pathD} fill="none" stroke="#8c7d6c" strokeWidth="2" />
        {points.map((p, i) => (
          <circle key={i} cx={p.x} cy={p.y} r={activeIdx === i ? 5 : 3}
            fill={activeIdx === i ? '#d4a843' : '#8c7d6c'}
            stroke={activeIdx === i ? '#15121e' : 'none'} strokeWidth={activeIdx === i ? 1.5 : 0}
            onClick={() => setActiveIdx(activeIdx === i ? null : i)}
            style={{ cursor: 'pointer' }} />
        ))}
      </svg>
      <div className="text-center text-[11px] mt-1 h-4">
        {active
          ? <span className="text-gold font-semibold">{formatShortDateWithYear(active.date)} · {active.weight} kg</span>
          : <span className="text-inkDim">Punkt antippen für Details</span>}
      </div>
    </div>
  );
}

function SportTrackModal({ date, existing, onSave, onDelete, onClose }) {
  const [calories, setCalories] = useState(existing && existing.calories != null ? String(existing.calories) : '');
  const [protein, setProtein] = useState(existing && existing.protein != null ? String(existing.protein) : '');
  const [weight, setWeight] = useState(existing && existing.weight != null ? String(existing.weight) : '');
  const hasExisting = !!(existing && (existing.calories != null || existing.protein != null || existing.weight != null));
  const proteinRef = useRef(null);
  const weightRef = useRef(null);

  function handleSave() {
    onSave({
      calories: calories.trim() === '' ? null : Number(calories),
      protein: protein.trim() === '' ? null : Number(protein),
      weight: weight.trim() === '' ? null : Number(weight),
    });
  }

  // type="number" behandelt enterKeyHint/Enter-Events auf Android unzuverlässig —
  // deshalb type="text" + inputMode (gleiche Zifferntastatur) und eigene Filterung.
  function onlyDigits(v) { return v.replace(/[^0-9]/g, ''); }
  function onlyDecimal(v) { return v.replace(/[^0-9.,]/g, '').replace(/(,)/g, '.').replace(/(\..*)\./g, '$1'); }
  function onEnterKey(e, action) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      e.preventDefault();
      action();
    }
  }

  return (
    <Modal title={`🏋️ Sport-Tracking · ${formatShortDateWithYear(date)}`} onClose={onClose}>
      <div className="space-y-4">
        <div>
          <SectionLabel>Kalorien</SectionLabel>
          <input type="text" inputMode="numeric" enterKeyHint="next" value={calories} onChange={e => setCalories(onlyDigits(e.target.value))}
            onKeyDown={e => onEnterKey(e, () => proteinRef.current?.focus())}
            placeholder="z. B. 2200" className="w-full bg-surface border border-border rounded-xl px-3 py-2.5 text-ink font-stat placeholder-inkDim/50" />
        </div>
        <div>
          <SectionLabel>Protein (g)</SectionLabel>
          <input ref={proteinRef} type="text" inputMode="numeric" enterKeyHint="next" value={protein} onChange={e => setProtein(onlyDigits(e.target.value))}
            onKeyDown={e => onEnterKey(e, () => weightRef.current?.focus())}
            placeholder="z. B. 140" className="w-full bg-surface border border-border rounded-xl px-3 py-2.5 text-ink font-stat placeholder-inkDim/50" />
        </div>
        <div>
          <SectionLabel>Körpergewicht (kg)</SectionLabel>
          <input ref={weightRef} type="text" inputMode="decimal" enterKeyHint="done" value={weight} onChange={e => setWeight(onlyDecimal(e.target.value))}
            onKeyDown={e => onEnterKey(e, () => weightRef.current?.blur())}
            placeholder="z. B. 78,5" className="w-full bg-surface border border-border rounded-xl px-3 py-2.5 text-ink font-stat placeholder-inkDim/50" />
        </div>
        <button onClick={handleSave}
          className="w-full bg-sport text-ink font-semibold rounded-xl py-3 active:scale-[0.98] transition-transform">
          Speichern
        </button>
        {hasExisting && (
          <button onClick={() => onDelete(date)}
            className="w-full border border-hp/40 text-hp text-sm rounded-xl py-2.5 active:scale-[0.98] transition-transform">
            🗑️ Löschen
          </button>
        )}
      </div>
    </Modal>
  );
}

  const [recurType, setRecurType] = useState(editingItem && editingItem.recurrence ? editingItem.recurrence.type : 'none');
  const [weekdays, setWeekdays] = useState(editingItem && editingItem.recurrence && editingItem.recurrence.type === 'weekly' ? editingItem.recurrence.weekdays : []);

  const [durationMinutes, setDurationMinutes] = useState(editingItem && editingItem.durationMinutes ? editingItem.durationMinutes : 60);

  const [exportToCalendar, setExportToCalendar] = useState(editingItem ? editingItem.exportToCalendar !== false : true);

    setWeekdays(w => (w.includes(i) ? w.filter(x => x !== i) : [...w, i].sort()));

function AgendaItemRow({ entry, profiles, onComplete, onUncomplete, onEdit, actionable, showDate }) {
  const { item, scheduledDate, done, overdue } = entry;
  const grayedOut = !done && item.kind === 'aufgabe' && !item.carryForward && overdue === 0 && scheduledDate < todayBerlin();
  const escalated = overdue >= 7 ? 'hp' : overdue >= 3 ? 'orange' : null;
  const creator = (profiles || []).find(p => p.id === item.creatorId) || null;
  const isAufgabe = item.kind === 'aufgabe';

  return (
    <div className={`flex items-center gap-2.5 rounded-xl border px-3 py-2.5 transition-colors ${
      done ? 'border-border bg-surface/40 opacity-60' :
      escalated === 'hp' ? 'border-hp/70 bg-hp/10' :
      escalated === 'orange' ? 'border-orange/70 bg-orange/10' :
      isAufgabe ? 'border-orange/35 bg-orange/5' :
      'border-shield/35 bg-shield/5'
    } ${grayedOut ? 'opacity-50' : ''}`}>
      {isAufgabe && (
        <button
          onClick={actionable ? () => (done ? onUncomplete(item.id, scheduledDate) : onComplete(item.id, scheduledDate)) : undefined}
          disabled={!actionable}
          aria-label={done ? 'Als nicht erledigt markieren (XP wird zurückgenommen)' : 'Als erledigt markieren'}
          title={done ? 'Verklickt? Hier wieder entklicken' : 'Erledigt'}
          className={`w-6 h-6 rounded-md border-2 flex items-center justify-center shrink-0 transition-transform ${
            done ? 'bg-heal border-heal text-bg' : 'border-border bg-bgElevated'
          } ${actionable ? 'active:scale-90' : 'opacity-60'}`}
        >
          {done && <span className="text-xs font-bold leading-none">✓</span>}
        </button>
      )}
      <button onClick={() => onEdit(item)} className="flex items-center gap-2.5 flex-1 min-w-0 text-left active:opacity-70">
        <span className="text-lg shrink-0">{item.icon}</span>
        <div className="flex-1 min-w-0">
          <div className={`text-sm truncate ${done ? 'line-through text-inkDim' : 'text-ink'}`}>{item.title}</div>
          <div className="text-[10px] text-inkDim flex items-center gap-1.5 flex-wrap">
            <span>{item.kind === 'termin' ? 'Termin' : 'Aufgabe'}</span>
            {item.time && <span>· {item.time}</span>}
            {showDate && <span>· {formatShortDate(scheduledDate)} {weekdayLabelFor(scheduledDate)}</span>}

              <span className={escalated === 'hp' ? 'text-hp font-semibold' : 'text-orange font-semibold'}>

        {creator && (
          <span className="flex items-center gap-0.5 text-[10px] text-inkDim/70" title={`Erstellt von ${creator.name}`}>

        {item.exportToCalendar !== false && (
          <button onClick={(e) => { e.stopPropagation(); exportItemToCalendar(item, scheduledDate); }}

  );

function UpcomingAgendaList({ entries, profiles, onEdit, birthdays, activeProfileId, questDeadlines, quests, questProgress }) {
  const [open, setOpen] = useState(false);

  const today = todayBerlin();

  // Geburtstage der nächsten 30 Tage
  const birthdayEntries = [];
  const visibleBirthdays = (birthdays || []).filter(b => !b.isPrivate || b.creatorId === activeProfileId);
  for (let i = 0; i < 30; i++) {
    const dateObj = new Date(today + 'T00:00:00');
    dateObj.setDate(dateObj.getDate() + i);
    const d = dateObj.getDate(), m = dateObj.getMonth() + 1;
    const dateStr = `${dateObj.getFullYear()}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    visibleBirthdays.forEach(b => {
      if (b.day === d && b.month === m) {
        const age = b.year ? dateObj.getFullYear() - b.year : null;
        birthdayEntries.push({ dateStr, b, age });
      }
    });
  }

  // Quest-Fristen der nächsten 30 Tage (nur offene)
  const deadlineEntries = Object.entries(questDeadlines || {})
    .filter(([questId, d]) => {
      if (!d || !d.date) return false;
      if (d.date < today || d.date > addDays(today, 30)) return false;
      const progress = (questProgress[d.date] || {})[questId];
      return progress !== 'komplett';
    })
    .map(([questId, d]) => ({ questId, deadline: d, quest: (quests || []).find(q => q.id === questId) }))
    .filter(({ quest }) => quest);

  // Zusammenführen und nach Datum sortieren
  const grouped = {};
  entries.forEach(e => {
    (grouped[e.scheduledDate] = grouped[e.scheduledDate] || { agenda: [], bdays: [], deadlines: [] }).agenda.push(e);
  });
  birthdayEntries.forEach(({ dateStr, b, age }) => {
    (grouped[dateStr] = grouped[dateStr] || { agenda: [], bdays: [], deadlines: [] }).bdays.push({ b, age });
  });
  deadlineEntries.forEach(({ questId, deadline, quest }) => {
    const ds = deadline.date;
    (grouped[ds] = grouped[ds] || { agenda: [], bdays: [], deadlines: [] }).deadlines.push({ quest, deadline });
  });

  const dates = Object.keys(grouped).sort();
  const totalCount = entries.length + birthdayEntries.length + deadlineEntries.length;

  return (
    <div className="mt-3">
      <button onClick={() => setOpen(o => !o)} className="w-full flex items-center justify-between text-xs text-inkDim py-2">
        <span>{open ? '▼' : '▶'} Nächste 30 Tage</span>
        <span className="font-stat">{totalCount} Einträge</span>
      </button>
      {open && (
        <div className="space-y-3 mt-1">
          {dates.length === 0 && <div className="text-xs text-inkDim pb-2">Nichts in den nächsten 30 Tagen geplant.</div>}
          {dates.map(d => (
            <div key={d}>
              <DateHeading dateStr={d} />
              <div className="space-y-1.5">
                {(grouped[d].deadlines || []).map(({ quest, deadline }) => (
                  <div key={quest.id} className="flex items-center gap-2.5 rounded-xl border border-hp/40 bg-hp/5 px-3 py-2.5">
                    <span className="text-lg shrink-0">{quest.icon}</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm text-ink truncate">{quest.title}</div>
                      <div className="text-[10px] text-hp">🔒 Frist{(!deadline.allDay && deadline.time) ? ` · ${deadline.time}` : ''}</div>
                    </div>
                  </div>
                ))}
                {(grouped[d].agenda || []).map(entry => (
                  <AgendaItemRow key={entry.item.id + '_' + entry.scheduledDate} entry={entry} profiles={profiles}
                    onComplete={() => {}} onEdit={onEdit} actionable={false} showDate={false} />
                ))}
                {(grouped[d].bdays || []).map(({ b, age }) => (
                  <div key={b.id} className="flex items-center gap-2.5 rounded-xl border border-birthday/50 bg-birthday/5 px-3 py-2.5">
                    <span className="text-lg shrink-0">🎂</span>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm text-ink truncate">{b.name}</div>
                      <div className="text-[10px] text-birthday">Geburtstag{age != null ? ` · wird ${age}` : ''}</div>
                    </div>
                    {b.isPrivate && <span className="text-[10px] text-inkDim shrink-0">🔒</span>}
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}
