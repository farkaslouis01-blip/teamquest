      <rect y="0" width="14" height="2" rx="1"/>
      <rect y="4" width="14" height="2" rx="1"/>
      <rect y="8" width="14" height="2" rx="1"/>
    </svg>
  );
}

const QUEST_H = 48; // px — Höhe einer Quest-Zeile (h-12)

function QuestEditModal({ quests, categories, onSave, onClose }) {
  const [cats, setCats] = useState([...categories]);
  const [qs, setQs] = useState(quests.map(q => ({ ...q })));
  const qsRef = useRef(qs); // immer synchron mit qs — für Speichern
  const catsRef = useRef(cats);

  // refs synchron halten
  function setQsSafe(updater) {
    setQs(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      qsRef.current = next;
      return next;
    });
  }
  function setCatsSafe(updater) {
    setCats(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      catsRef.current = next;
      return next;
    });
  }
  const [editingId, setEditingId] = useState(null);
  const [editingCat, setEditingCat] = useState(null);
  const [editingCatName, setEditingCatName] = useState('');

  // Drag-State (useState für Re-Renders, useRef für aktuellen Wert in Event-Handlern)
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  // FLIP: Element das gerade eingeordnet wird
  const [dropping, setDropping] = useState(null); // { kind, id, fromY }

  // DOM-Refs für Höhenmessung und FLIP-Animation
  const catRefs  = useRef({}); // catName → DOM-Element
  const questRefs = useRef({}); // q.id   → DOM-Element

  const dragOffsetY = drag ? drag.currentY - drag.startY : 0;

  // dropIdx mit echter Höhe für Kategorien, fixer Höhe für Quests
  function calcCatDropIdx(origIdx, offsetY) {
    const heights = cats.map(c => catRefs.current[c]?.offsetHeight || 80);
    if (offsetY > 0) {
      let t = 0;
      for (let i = origIdx + 1; i < cats.length; i++) {
        t += heights[i] * 0.5; if (offsetY < t) return i - 1;
        t += heights[i] * 0.5;
      }
      return cats.length - 1;
    } else if (offsetY < 0) {
      let t = 0;
      for (let i = origIdx - 1; i >= 0; i--) {
        t += heights[i] * 0.5; if (-offsetY < t) return i + 1;
        t += heights[i] * 0.5;
      }
      return 0;
    }
    return origIdx;
  }

  const dropIdx = drag == null ? null : drag.kind === 'cat'
    ? calcCatDropIdx(drag.origIdx, dragOffsetY)
    : Math.max(0, Math.min(drag.listLen - 1, drag.origIdx + Math.round(dragOffsetY / QUEST_H)));

  function shiftFor(myIdx) {
    if (!drag || dropIdx === null || dropIdx === drag.origIdx) return 0;
    const o = drag.origIdx, d = dropIdx;
    const shiftAmt = drag.kind === 'cat'
      ? (catRefs.current[drag.id]?.offsetHeight || 80)
      : QUEST_H;
    if (o < d && myIdx > o && myIdx <= d) return -shiftAmt;
    if (o > d && myIdx < o && myIdx >= d) return +shiftAmt;
    return 0;
  }

  // settling=true → alle Nicht-FLIP-Elemente erhalten kurz transition:none,
  // damit sie nicht falsch animieren. Nach einem Frame wieder deaktiviert.
  const [settling, setSettling] = useState(false);

  // FLIP-Animation: nach dem Einordnen das Element von seiner alten visuellen
  // Position sanft an die neue DOM-Position animieren.
  // useLayoutEffect → greift synchron nach DOM-Update, VOR dem Browser-Paint.
  useLayoutEffect(() => {
    if (!dropping) return;
    const el = dropping.kind === 'cat'
      ? catRefs.current[dropping.id]
      : questRefs.current[dropping.id];
    if (!el) { setDropping(null); return; }

    const newY = el.getBoundingClientRect().top;
    const delta = dropping.fromY - newY;
    if (Math.abs(delta) < 1) { setDropping(null); return; }

    // 1) Element sofort an alte visuelle Position versetzen (kein Übergang)
    el.style.transition = 'none';
    el.style.transform = `translateY(${delta}px)`;
    void el.offsetHeight; // Reflow erzwingen

    // 2) Smooth zur endgültigen Position animieren
    el.style.transition = 'transform 240ms cubic-bezier(0.2, 0, 0, 1)';
    el.style.transform = 'translateY(0)';

    let timer;
    const cleanup = () => { el.style.cssText = ''; setDropping(null); clearTimeout(timer); };
    el.addEventListener('transitionend', cleanup, { once: true });
    timer = setTimeout(cleanup, 400);
    return () => clearTimeout(timer);
  }, [dropping]);

  // Globale Mouse/Touch-Events — einmalig beim Mount registriert.
  // dragRef.current dient als Guard, damit nur reagiert wird wenn ein Drag läuft.
  useEffect(() => {
    const getY = e => (e.changedTouches?.length ? e.changedTouches[0].clientY : e.touches?.length ? e.touches[0].clientY : e.clientY);

    function onMove(e) {
      if (!dragRef.current) return;
      if (e.cancelable) e.preventDefault();
      const newY = getY(e);
      dragRef.current = { ...dragRef.current, currentY: newY };
      setDrag(d => d ? { ...d, currentY: newY } : null);
    }

    function onEnd(e) {
      const d = dragRef.current;
      if (!d) return;
      const offsetY = getY(e) - d.startY;
      const targetIdx = d.kind === 'cat'
        ? calcCatDropIdx(d.origIdx, offsetY)
        : Math.max(0, Math.min(d.listLen - 1, d.origIdx + Math.round(offsetY / QUEST_H)));

      // Visuelle Position VOR dem State-Update messen (inkl. laufendem Transform)
      const el = d.kind === 'cat' ? catRefs.current[d.id] : questRefs.current[d.id];
      const fromY = el?.getBoundingClientRect().top ?? null;

      dragRef.current = null;
      setDrag(null);

      if (targetIdx !== d.origIdx) {
        if (d.kind === 'cat') {
          setCatsSafe(prev => {
            const next = [...prev];
            const [item] = next.splice(d.origIdx, 1);
            next.splice(targetIdx, 0, item);
            return next;
          });
        } else {
          setQsSafe(prev => {
            const next = [...prev];
            const catIdxs = next.map((q, i) => q.category === d.catName ? i : -1).filter(i => i >= 0);
            const [item] = next.splice(catIdxs[d.origIdx], 1);
            const catIdxs2 = next.map((q, i) => q.category === d.catName ? i : -1).filter(i => i >= 0);
            next.splice(catIdxs2[targetIdx] ?? next.length, 0, item);
            return next;
          });
        }
        if (fromY !== null) {
          setSettling(true);
          requestAnimationFrame(() => setSettling(false));
          setDropping({ kind: d.kind, id: d.id, fromY });
        }
      }
    }

    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onEnd);
    return () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onEnd);
      document.removeEventListener('touchmove', onMove);
      document.removeEventListener('touchend', onEnd);
    };
  }, []); // einmalig beim Mount

  return (
    <>
    <Modal title="✏️ Quests bearbeiten" onClose={onClose} wide>
      <div className="text-[10px] text-inkDim mb-3">≡ greifen und ziehen zum Sortieren.</div>
      <div className="space-y-5 max-h-[60vh] overflow-y-auto" style={{ userSelect: drag ? 'none' : 'auto' }}>
        {cats.map((cat, ci) => {
          const isSelf = drag?.kind === 'cat' && drag?.id === cat;
          const isDropping = dropping?.kind === 'cat' && dropping?.id === cat;
          const shift = isSelf ? 0 : (drag?.kind === 'cat' ? shiftFor(ci) : 0);
          const translateY = isSelf ? dragOffsetY : shift;
          const catQuests = qs.filter(q => q.category === cat);
          return (
            <div key={cat}
              ref={el => { catRefs.current[cat] = el; }}
              style={isDropping ? {} : {
                transform: `translateY(${translateY}px)`,
                transition: (isSelf || settling) ? 'none' : 'transform 160ms ease',
                zIndex: isSelf ? 20 : 1,
                position: 'relative',
                boxShadow: isSelf ? '0 8px 32px rgba(0,0,0,0.45)' : 'none',
              }}
              className={`bg-bgElevated rounded-2xl border overflow-hidden ${isSelf ? 'scale-[1.02] border-gold/50' : 'border-border'}`}>
              <div className="flex items-center gap-2.5 px-3 border-b border-border bg-surface" style={{ height: editingCat === cat ? 'auto' : 44, minHeight: 44, paddingTop: editingCat === cat ? 8 : 0, paddingBottom: editingCat === cat ? 8 : 0 }}>
                {editingCat !== cat && (
                  <div className="cursor-grab active:cursor-grabbing select-none p-1.5 -ml-1 rounded shrink-0"
                    onMouseDown={e => { e.preventDefault(); const d = { kind:'cat', id:cat, catName:'', origIdx:ci, listLen:cats.length, startY:e.clientY, currentY:e.clientY }; dragRef.current = d; setDrag(d); }}
                    onTouchStart={e => { e.preventDefault(); const d = { kind:'cat', id:cat, catName:'', origIdx:ci, listLen:cats.length, startY:e.touches[0].clientY, currentY:e.touches[0].clientY }; dragRef.current = d; setDrag(d); }}>
                    <GripIcon />
                  </div>
                )}
                {editingCat === cat ? (
                  <div className="flex items-center gap-2 flex-1">
                    <input type="text" value={editingCatName}
                      onChange={e => setEditingCatName(e.target.value)}
                      enterKeyHint="done" onKeyDown={e => { if (e.key === 'Enter') { e.target.blur(); } }}
                      autoFocus
                      className="flex-1 bg-bg border border-gold/50 rounded-lg px-2.5 py-1.5 text-sm text-ink" />
                    <button onClick={() => {
                      const newName = editingCatName.trim();
                      if (newName && newName !== cat) {
                        setCatsSafe(prev => prev.map(c => c === cat ? newName : c));
                        setQsSafe(prev => prev.map(q => q.category === cat ? { ...q, category: newName } : q));
                      }
                      setEditingCat(null);
                    }} className="text-xs font-semibold text-gold border border-gold/40 bg-gold/10 rounded-lg px-2.5 py-1.5 active:scale-95 shrink-0">✓</button>
                    <button onClick={() => setEditingCat(null)}
                      className="text-xs text-inkDim border border-border rounded-lg px-2 py-1.5 active:scale-95 shrink-0">✕</button>
                  </div>
                ) : (
                  <span className="text-xs font-semibold text-gold flex-1 truncate">{cat}</span>
                )}
                {editingCat !== cat && (
                  <>
                    <button onClick={() => { setEditingCat(cat); setEditingCatName(cat); }}
                      className="w-7 h-7 rounded-lg border border-border bg-bgElevated text-inkDim text-xs active:scale-90 flex items-center justify-center shrink-0">✏️</button>
                    <DeleteButton onDelete={() => {
                      setCatsSafe(prev => prev.filter(c => c !== cat));
                      setQsSafe(prev => prev.filter(q => q.category !== cat));
                    }} />
                  </>
                )}
              </div>
              <div className="divide-y divide-border/50">
                {catQuests.length === 0 && (
                  <div className="px-3 py-2 text-xs text-inkDim">Keine Quests in dieser Kategorie.</div>
                )}
                {catQuests.map((q, qi) => {
                  const isEditing = editingId === q.id;
                  const isSelfQ = drag?.kind === 'quest' && drag?.id === q.id;
                  const isDroppingQ = dropping?.kind === 'quest' && dropping?.id === q.id;
                  const shiftQ = isSelfQ ? 0 : (drag?.kind === 'quest' && drag?.catName === cat ? shiftFor(qi) : 0);
                  const translateYQ = isSelfQ ? dragOffsetY : shiftQ;

                  function liveUpdate(patch) {
                    setQsSafe(prev => prev.map(item => item.id === q.id ? { ...item, ...patch } : item));
                  }

                  return (
                    <div key={q.id}
                      ref={el => { questRefs.current[q.id] = el; }}
                      style={isDroppingQ ? {} : {
                        transform: `translateY(${translateYQ}px)`,
                        transition: (isSelfQ || settling) ? 'none' : 'transform 160ms ease',
                        zIndex: isSelfQ ? 20 : 1,
                        position: 'relative',
                        boxShadow: isSelfQ ? '0 6px 20px rgba(0,0,0,0.4)' : 'none',
                      }}
                      className={`px-3 ${isEditing ? 'py-2.5' : ''} ${isSelfQ ? 'bg-surface scale-[1.01]' : ''}`}>
                      {isEditing ? (
                        <div className="space-y-2">
                          <div className="flex gap-2">
                            <input type="text" value={q.title}
                              onChange={e => liveUpdate({ title: e.target.value })}
                              enterKeyHint="done" onKeyDown={e => { if (e.key === 'Enter') { e.target.blur(); setEditingId(null); } }}
                              className="flex-1 bg-surface border border-gold/40 rounded-lg px-3 py-2 text-sm text-ink" />
                            <input type="text" value={q.icon}
                              onChange={e => liveUpdate({ icon: e.target.value.slice(0, 2) })}
                              enterKeyHint="done" onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }}
                              className="w-14 bg-surface border border-border rounded-lg px-2 py-2 text-xl text-center" />
                          </div>
                          <select value={q.category} onChange={e => liveUpdate({ category: e.target.value })}
                            className="w-full bg-surface border border-border rounded-lg px-3 py-2 text-sm text-ink">
                            {cats.map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                          <button onClick={() => setEditingId(null)}
                            className="w-full text-xs text-inkDim border border-border rounded-lg py-1.5 active:scale-95">
                            Fertig
                          </button>
                        </div>
                      ) : (
                        <div className="flex items-center gap-2.5" style={{ height: QUEST_H }}>
                          <div className="cursor-grab active:cursor-grabbing select-none p-1.5 -ml-1 rounded shrink-0"
                            onMouseDown={e => { e.preventDefault(); const d = { kind:'quest', id:q.id, catName:cat, origIdx:qi, listLen:catQuests.length, startY:e.clientY, currentY:e.clientY }; dragRef.current = d; setDrag(d); }}
                            onTouchStart={e => { e.preventDefault(); const d = { kind:'quest', id:q.id, catName:cat, origIdx:qi, listLen:catQuests.length, startY:e.touches[0].clientY, currentY:e.touches[0].clientY }; dragRef.current = d; setDrag(d); }}>
                            <GripIcon />
                          </div>
                          <span className="text-base shrink-0">{q.icon}</span>
                          <span className="text-sm text-ink flex-1 min-w-0 truncate">{q.title}</span>
                          <span className="text-[10px] font-stat text-gold shrink-0">{q.category === SPORT_CATEGORY ? 'Sport' : `${REGULAR_QUEST_XP} XP`}</span>
                          <button onClick={() => setEditingId(q.id)}
                            className="w-7 h-7 rounded-lg border border-border bg-bgElevated text-inkDim text-xs active:scale-90 flex items-center justify-center shrink-0">✏️</button>
                          <DeleteButton onDelete={() => setQsSafe(prev => prev.filter(item => item.id !== q.id))} />
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
      <button onClick={() => onSave(catsRef.current, qsRef.current)} className="w-full bg-gold text-bg font-semibold rounded-xl py-3 mt-4 active:scale-[0.98]">
        Speichern
      </button>
    </Modal>
    </>
  );
}

// Karussell für Fristen — native scroll-snap für Swipe-Animation
function DeadlineCarousel({ deadlines, onComplete }) {
  const [activeIdx, setActiveIdx] = useState(0);
  const scrollRef = useRef(null);

  function handleScroll() {
    const el = scrollRef.current;
    if (!el) return;
    const cardW = el.firstChild?.offsetWidth || el.offsetWidth;
    const idx = Math.round(el.scrollLeft / (cardW + 10));
    setActiveIdx(Math.max(0, Math.min(idx, deadlines.length - 1)));
  }

  return (
    <div>
      <div
        ref={scrollRef}
        onScroll={handleScroll}
        style={{
          display: 'flex',
          overflowX: 'auto',
          scrollSnapType: 'x mandatory',
          WebkitOverflowScrolling: 'touch',
          gap: 10,
          paddingRight: deadlines.length > 1 ? 44 : 0,
          scrollbarWidth: 'none',
          msOverflowStyle: 'none',
        }}
        className="[&::-webkit-scrollbar]:hidden"
      >
        {deadlines.map(({ quest, deadline }) => {
          const label = deadlineLabel(deadline.date);
          const days = daysUntil(deadline.date);
          const urgent = days <= 1;
          return (
            <div key={quest.id}
              style={{ minWidth: deadlines.length > 1 ? 'calc(100% - 54px)' : '100%', scrollSnapAlign: 'start', flex: 'none' }}
              className={`flex items-center gap-2.5 rounded-xl border px-3 py-2.5 ${urgent ? 'border-hp/60 bg-hp/5' : 'border-orange/40 bg-orange/5'}`}>
              <span className="text-lg shrink-0">{quest.icon}</span>
              <div className="flex-1 min-w-0">
                <div className="text-sm text-ink truncate">{quest.title}</div>
                <div className={`text-[10px] font-bold ${urgent ? 'text-hp' : 'text-orange'}`}>
                  🔒 {label}{(!deadline.allDay && deadline.time) ? ` · ${deadline.time}` : ''}
                </div>
              </div>
              <button onClick={() => onComplete(quest.id)}
                className="shrink-0 border border-heal/50 bg-heal/10 text-heal text-xs font-semibold rounded-lg px-2.5 py-2 active:scale-95">
                Fertig
              </button>
            </div>
          );
        })}
      </div>
      {deadlines.length > 1 && (
        <div className="flex justify-center gap-1.5 mt-1.5">
          {deadlines.map((_, i) => (
            <div key={i} style={{ transition: 'all 200ms' }}
              className={`rounded-full h-1.5 ${i === activeIdx ? 'w-4 bg-orange' : 'w-1.5 bg-border'}`} />
          ))}
        </div>
      )}
    </div>
  );
}

function QuestsTab({ state, profile, onQuestComplete, onQuestUncomplete, onAddQuest, onEditQuests, onSetDeadline, onCalendarComplete, onCalendarUncomplete, onOpenAddCalendar, onOpenEditCalendar }) {
  const [showAdd, setShowAdd] = useState(false);
  const [showEdit, setShowEdit] = useState(false);
  const today = todayBerlin();
  const todayProgress = profile.questProgress[today] || {};
  const completedTodayCount = Object.values(todayProgress).filter(v => v === 'komplett').length;
  const actionsEarned = getActionsEarnedToday(profile);
  const actionsAvailable = getAvailableActions(profile);
  const questsUntilNextAction = nextActionThreshold(completedTodayCount) - completedTodayCount;
  const allDone = state.quests.length > 0 && state.quests.every(q => todayProgress[q.id] === 'komplett');
  const someDone = state.quests.some(q => todayProgress[q.id]);
  const todayAgenda = sortAgendaEntries(getTodayAgenda(state, today, profile.id).filter(e => !e.done));
  const questDeadlines = profile.questDeadlines || {};
  const [sportMinutesQuest, setSportMinutesQuest] = useState(null); // Quest-Objekt oder null

  function requestComplete(questId) {
    const quest = state.quests.find(q => q.id === questId);
    if (!quest) return;
    if (quest.category === SPORT_CATEGORY) setSportMinutesQuest(quest);
    else onQuestComplete(questId, null);
  }

  // Offene Fristen für den Quest-Tab
  const upcomingDeadlinesForQuestTab = Object.entries(questDeadlines)
    .filter(([questId, d]) => {
      if (!d || !d.date || d.date < today) return false;
      const progress = (profile.questProgress[d.date] || {})[questId];
      return progress !== 'komplett';
    })
    .map(([questId, d]) => ({ quest: state.quests.find(q => q.id === questId), deadline: d }))
    .filter(({ quest }) => quest)
    .sort((a, b) => a.deadline.date.localeCompare(b.deadline.date));

  const categoriesWithQuests = state.questCategories.filter(cat => state.quests.some(q => q.category === cat));

  return (
    <div className="px-4 pt-4 pb-28 space-y-4">
      <TodayAgendaCard
        entries={todayAgenda}
        profiles={state.profiles}
        onComplete={onCalendarComplete}
        onUncomplete={onCalendarUncomplete}
        onEdit={onOpenEditCalendar}
        onAddClick={onOpenAddCalendar}
      />

      {upcomingDeadlinesForQuestTab.length > 0 && (
        <DeadlineCarousel
          deadlines={upcomingDeadlinesForQuestTab}
          onComplete={(questId) => requestComplete(questId)}
        />
      )}

      <div className="flex items-center justify-between">
        <div className="font-display text-lg font-bold text-ink">
          Heutige Quests
          {allDone && <span className="ml-2 text-sm font-sans font-normal text-gold">🌟 Alles erledigt!</span>}
        </div>
        <div className="text-right">
          <div className="font-stat text-sm text-gold">⚔️ {actionsEarned}</div>
          <div className="text-[10px] text-inkDim">Kampf-Aktionen heute</div>
          <div className="text-[10px] text-inkDim mt-0.5">noch {questsUntilNextAction} bis zur nächsten</div>
        </div>
      </div>

      <div className="space-y-2.5">
        {categoriesWithQuests.map(cat => (
          <QuestCategorySection
            key={cat}
            category={cat}
            quests={state.quests.filter(q => q.category === cat)}
            todayProgress={todayProgress}
            questDeadlines={questDeadlines}
            onComplete={(questId) => requestComplete(questId)}
            onUncomplete={onQuestUncomplete}

      <div className="flex gap-2">
        <button onClick={() => setShowAdd(true)}
          className="flex-1 border border-dashed border-border rounded-2xl py-3 text-sm text-inkDim active:scale-[0.99]">

        </button>
        <button onClick={() => setShowEdit(true)}

      {actionsAvailable > 0 && (
        <div className="text-xs text-inkDim text-center">

function CalendarGrid({ profile, calendarItems, selectedDate, onSelectDate, birthdays }) {
  const [monthOffset, setMonthOffset] = useState(0);
  const [slideDir, setSlideDir] = useState('right'); // Richtung der letzten Monats-Animation
  const [showMonthPicker, setShowMonthPicker] = useState(false);
  const touchStartRef = useRef(null);

  function goToMonth(delta) {
    setSlideDir(delta > 0 ? 'right' : 'left');
    setMonthOffset(o => o + delta);
  }

  // Direkt zu einem bestimmten Jahr/Monat springen (aus dem Monats-Picker).
  function jumpToMonth(targetYear, targetMonth) {
    const now = new Date();
    const targetOffset = (targetYear - now.getFullYear()) * 12 + (targetMonth - now.getMonth());
    setSlideDir(targetOffset >= monthOffset ? 'right' : 'left');
    setMonthOffset(targetOffset);
    setShowMonthPicker(false);
  }

  // Wisch-Geste: nach links wischen = nächster Monat, nach rechts wischen = vorheriger Monat.
  // Nur reagieren, wenn die Bewegung deutlich horizontaler als vertikaler Natur ist
  // (sonst würde normales Scrollen versehentlich den Monat wechseln).
  function handleTouchStart(e) {
    const t = e.touches[0];
    touchStartRef.current = { x: t.clientX, y: t.clientY };
  }
  function handleTouchEnd(e) {
    if (!touchStartRef.current) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartRef.current.x;
    const dy = t.clientY - touchStartRef.current.y;
    touchStartRef.current = null;
    const SWIPE_THRESHOLD = 45;
    if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy) * 1.5) {
      goToMonth(dx < 0 ? 1 : -1);
    }
  }

  const now = new Date();
  const ref = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const year = ref.getFullYear(), month = ref.getMonth();
  const firstWeekday = (new Date(year, month, 1).getDay() + 6) % 7; // Mo=0
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthName = ref.toLocaleDateString('de-DE', { month: 'long', year: 'numeric' });

  const cells = [];
  for (let i = 0; i < firstWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  function dateStrFor(d) {
    return `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  }

  // Ein einzelner grüner Punkt, sobald an dem Tag mindestens eine Aufgabe
  // erledigt wurde — unabhängig davon, wie viele es insgesamt waren.
  function hasProgress(d) {
    const progress = profile.questProgress[dateStrFor(d)];
    return !!progress && Object.keys(progress).length > 0;
  }

  // Alle Kalender-Vorkommen (Aufgaben/Termine inkl. Wiederholungen) für den
  // sichtbaren Monat dem Tag zuordnen, an dem sie tatsächlich erscheinen sollen:
  // erledigte Aufgaben am Tag der Erledigung, offene am effektiven (ggf. mitgenommenen) Tag.
  const calendarByDate = daysInMonth > 0
    ? getMonthAgenda(({ calendarItems: calendarItems || [] }), dateStrFor(1), dateStrFor(daysInMonth), todayBerlin(), profile.id)
    : {};

  return (
    <div onTouchStart={handleTouchStart} onTouchEnd={handleTouchEnd}>
      <div className="flex items-center justify-between mb-2">
        <button onClick={() => goToMonth(-1)} className="text-inkDim px-2">‹</button>
        <button onClick={() => setShowMonthPicker(true)} className="text-sm font-medium capitalize active:opacity-70">{monthName}</button>
        <button onClick={() => goToMonth(1)} className="text-inkDim px-2">›</button>
      </div>
      <div className="grid grid-cols-7 gap-1 text-center text-[10px] text-inkDim mb-1">
        {['Mo','Di','Mi','Do','Fr','Sa','So'].map(d => <div key={d}>{d}</div>)}
      </div>
      <div className="overflow-hidden">
        <div key={monthOffset} className={`grid grid-cols-7 gap-1 ${slideDir === 'right' ? 'cal-slide-right' : 'cal-slide-left'}`}>
          {cells.map((d, i) => {
            if (d === null) return <div key={i}></div>;
            const dateStr = dateStrFor(d);
            const done = hasProgress(d);
            const dayEntries = calendarByDate[dateStr] || [];
            const hasAufgabe = dayEntries.some(e => e.item.kind === 'aufgabe' && !e.done);
            const hasTermin = dayEntries.some(e => e.item.kind === 'termin' && !e.done);
            const hasSport = profile.sportTrackingEnabled && !!(profile.sportLog && profile.sportLog[dateStr] &&
              (profile.sportLog[dateStr].calories != null || profile.sportLog[dateStr].protein != null || profile.sportLog[dateStr].weight != null));
            const [bYear, bMonth, bDay] = dateStr.split('-').map(Number);
            const hasBirthday = (birthdays || []).some(b => b.day === bDay && b.month === bMonth && (!b.isPrivate || b.creatorId === profile.id));
            const hasDeadline = Object.values(profile.questDeadlines || {}).some(d => d && d.date === dateStr);
            const isSelected = selectedDate === dateStr;
            const isToday = dateStr === todayBerlin();
            const isVacation = (profile.work?.vacationDays || []).some(v => v.from <= dateStr && dateStr <= v.to);
            const isSick = (profile.work?.sickDays || []).some(s => s.from <= dateStr && dateStr <= s.to);
            const isAbsent = (profile.work?.workLog || []).some(e => e.date === dateStr && e.type === 'absent');
            const isHoliday = (profile.work?.enabled) && rlpHolidaysForYear(parseInt(dateStr.slice(0,4))).has(dateStr);
            return (
              <button
                key={i}
                onClick={() => onSelectDate(isSelected ? null : dateStr)}
                title={isHoliday ? rlpHolidayName(dateStr) : undefined}
                className={`aspect-square flex flex-col items-center justify-center text-[10px] rounded-lg border ${
                  isSelected ? 'bg-gold/15 border-gold' :
                  isVacation ? 'bg-[#c026d3]/10 border-[#c026d3]/60' :
                  isSick ? 'bg-hp/10 border-hp/40' :
                  isHoliday ? 'bg-orange/10 border-orange/50' :
                  isToday ? 'bg-shield/20 border-shield' : 'bg-surface border-border'
                }`}
              >
                <span className={
                  isToday ? 'text-shield font-bold' :
                  isVacation ? 'text-[#c026d3]' :
                  isSick ? 'text-hp' :
                  isHoliday ? 'text-orange font-semibold' :
                  'text-inkDim'
                }>{d}</span>
                <span className="flex items-center gap-0.5 h-1.5 mt-0.5">
                  {isHoliday && <span className="text-[7px] leading-none">✦</span>}
                  {isAbsent && <span className="text-[8px] leading-none text-hp">⚠</span>}
                  {done && <span className="w-1.5 h-1.5 rounded-full bg-heal"></span>}
                  {hasAufgabe && <span className="w-1.5 h-1.5 rounded-full bg-orange"></span>}
                  {hasTermin && <span className="w-1.5 h-1.5 rounded-full bg-shield"></span>}
                  {hasSport && <span className="w-1.5 h-1.5 rounded-full bg-sport"></span>}
                  {hasBirthday && <span className="w-1.5 h-1.5 rounded-full bg-birthday"></span>}
                  {hasDeadline && <span className="w-1.5 h-1.5 rounded-full bg-hp flex items-center justify-center text-[6px] text-white font-bold leading-none">!</span>}
                </span>
              </button>
            );
          })}
        </div>
      </div>
      {showMonthPicker && (
        <MonthYearPicker year={year} month={month} onJump={jumpToMonth} onClose={() => setShowMonthPicker(false)} />
      )}
    </div>
  );
}

function MethodsLibrary({ profile }) {

  return (

function UiScaleSetting() {
  const [scale, setScale] = useState(() => getStoredUiScale());

  function changeScale(next) {
    const clamped = Math.round(Math.min(1.3, Math.max(0.8, next)) * 100) / 100;
    setScale(clamped);
    localStorage.setItem(UI_SCALE_KEY, String(clamped));
    applyUiScale(clamped);
  }

  return (
    <div className="bg-surface border border-border rounded-2xl p-4">
      <div className="text-sm font-medium text-ink mb-1">App-Größe auf diesem Gerät</div>
      <div className="text-xs text-inkDim leading-relaxed mb-4">
        Wirkt auf Texte, Karten und Abstände in der App — unabhängig von der Anzeigegröße im Telefon selbst. Gilt nur für dieses Gerät, der Partner ist davon nicht betroffen.
      </div>
      <div className="flex items-center gap-3">
        <button onClick={() => changeScale(scale - 0.05)} disabled={scale <= 0.8}
          className="w-11 h-11 rounded-xl border border-border bg-bgElevated text-ink text-lg font-bold disabled:opacity-30 active:scale-95">
          −
        </button>
        <div className="flex-1 text-center font-stat text-base text-gold">{Math.round(scale * 100)}%</div>
        <button onClick={() => changeScale(scale + 0.05)} disabled={scale >= 1.3}
          className="w-11 h-11 rounded-xl border border-border bg-bgElevated text-ink text-lg font-bold disabled:opacity-30 active:scale-95">
          +
        </button>
      </div>
      {scale !== 1 && (
        <button onClick={() => changeScale(1)} className="w-full text-xs text-inkDim mt-3 underline">
          Auf 100% zurücksetzen
        </button>
      )}
    </div>
  );
}

          </div>
          <div className="flex-1">
            <SectionLabel>Monat</SectionLabel>
            <select value={month} onChange={e => setMonth(e.target.value)}
              className="w-full bg-surface border border-border rounded-xl px-3 py-2.5 text-ink">

            onChange={e => setYear(e.target.value.replace(/\D/g,'').slice(0,4))}

          </button>
        </div>
        <button disabled={!canSave} onClick={() => onSave({ name: name.trim(), day: Number(day), month: Number(month), year: year ? Number(year) : null, isPrivate: isPrivate })}
          className={`w-full font-semibold rounded-xl py-3 active:scale-[0.98] transition-transform ${canSave ? 'bg-birthday text-ink' : 'bg-border text-inkDim'}`}>
          Speichern
        </button>
        {existing && onDelete && (
          <button onClick={onDelete}
            className="w-full border border-hp/40 text-hp text-sm rounded-xl py-2.5 active:scale-[0.98]">
            🗑️ Löschen
          </button>
        )}
      </div>
    </Modal>
  );

function BirthdaysSection({ birthdays, activeProfileId, onAdd, onDelete }) {
  const [modal, setModal] = useState(null); // null | { mode:'add' } | { mode:'edit', birthday }
  const today = new Date();
  // Nur eigene private + alle öffentlichen Geburtstage anzeigen
  const visible = (birthdays || []).filter(b => !b.isPrivate || b.creatorId === activeProfileId);
  const sorted = [...visible].sort((a, b) => a.month * 100 + a.day - (b.month * 100 + b.day));

  function getAge(b) {
    if (!b.year) return null;
    const age = today.getFullYear() - b.year;
    const hasBirthdayPassed = today.getMonth() + 1 > b.month || (today.getMonth() + 1 === b.month && today.getDate() >= b.day);
    return hasBirthdayPassed ? age : age - 1;
  }

  return (
    <div className="space-y-3">
      {sorted.length === 0 && <div className="text-xs text-inkDim">Noch keine Geburtstage eingetragen.</div>}
      {sorted.map(b => {
        const age = getAge(b);
        const nextAge = age != null ? age + 1 : null;
        return (
          <div key={b.id} className="flex items-center gap-3 bg-surface border border-birthday/30 rounded-2xl px-4 py-3 active:opacity-70"
            onClick={() => setModal({ mode: 'edit', birthday: b })}>
            <div className="text-2xl">🎂</div>
            <div className="flex-1 min-w-0">
              <div className="text-sm font-medium text-ink">{b.name}</div>
              <div className="text-[11px] text-inkDim mt-0.5">
                {String(b.day).padStart(2,'0')}.{String(b.month).padStart(2,'0')}{b.year ? `.${b.year}` : ''} {nextAge != null ? `· wird ${nextAge}` : ''} {b.isPrivate ? '· 🔒 nur du' : ''}
              </div>
            </div>
            <span className="text-inkDim text-xs">✏️</span>
          </div>
        );
      })}
      <button onClick={() => setModal({ mode: 'add' })}
        className="w-full border border-dashed border-birthday/40 rounded-2xl py-3 text-sm text-birthday active:scale-[0.99]">
        + Geburtstag hinzufügen
      </button>
      {modal && (
        <BirthdayModal
          existing={modal.mode === 'edit' ? modal.birthday : null}
          onSave={data => { onAdd(modal.mode === 'edit' ? { ...data, id: modal.birthday.id } : data); setModal(null); }}
          onDelete={modal.mode === 'edit' ? () => { onDelete(modal.birthday.id); setModal(null); } : null}
          onClose={() => setModal(null)}
        />
      )}
    </div>
  );
}

// Hook: Android-Zurück-Taste für Modals abfangen.
function useBackButton(isOpen, onClose) {
  useEffect(() => {
    if (!isOpen) return;
    history.pushState({ modal: true }, '');
    const handler = e => { onClose(); };
    window.addEventListener('popstate', handler);
    return () => window.removeEventListener('popstate', handler);
  }, [isOpen]);
}

const WEEK_DAYS = ['So','Mo','Di','Mi','Do','Fr','Sa'];

function WorkSettings({ work, onChange }) {
  // Sendet NUR das geänderte Feld (nicht das komplette work-Objekt) — verhindert,
  // dass ein Feld ein anderes überschreibt, falls beide kurz hintereinander geändert
  // werden, bevor der aktualisierte "work"-Prop hier zurückkommt.
  function set(key, val) { onChange({ [key]: val }); }
  function toggleDay(d) {
    const days = work.workDays || [1,2,3,4,5];
    set('workDays', days.includes(d) ? days.filter(x => x !== d) : [...days, d].sort());
  }
  const [hoursStr, setHoursStr] = useState(String(work.hoursPerDay ?? 8));
  const [vacStr, setVacStr] = useState(String(work.vacationDaysPerYear ?? 30));
  const [startDateStr, setStartDateStr] = useState(work.startDate || '');

  // Bei externer Änderung (z. B. Partner-Sync oder Import) die Anzeige aktuell halten —
  // sonst zeigt das Feld weiter den alten Wert, bis man es manuell anfasst.
  useEffect(() => { setHoursStr(String(work.hoursPerDay ?? 8)); }, [work.hoursPerDay]);
  useEffect(() => { setVacStr(String(work.vacationDaysPerYear ?? 30)); }, [work.vacationDaysPerYear]);
  useEffect(() => { setStartDateStr(work.startDate || ''); }, [work.startDate]);

  return (
    <div className="space-y-4">
      <div>
        <div className="text-xs text-inkDim mb-2">Arbeitstage</div>
        <div className="flex gap-1.5">
          {[1,2,3,4,5,6,0].map(d => (
            <button key={d} onClick={() => toggleDay(d)}
              className={`flex-1 py-2 rounded-xl text-xs font-semibold border transition-colors ${
                (work.workDays||[1,2,3,4,5]).includes(d)
                  ? 'bg-gold/20 border-gold/60 text-gold'
                  : 'bg-surface border-border text-inkDim'}`}>
              {WEEK_DAYS[d]}
            </button>
          ))}
        </div>
      </div>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <div className="text-xs text-inkDim mb-1.5">Stunden/Tag</div>
          <input type="text" inputMode="numeric" value={hoursStr}
            onChange={e => setHoursStr(e.target.value)}
            onBlur={() => {
              const v = parseInt(hoursStr);
              if (!isNaN(v) && v > 0) set('hoursPerDay', v);
              setHoursStr(String(isNaN(v) || v <= 0 ? (work.hoursPerDay ?? 8) : v));
            }}
            className="w-full bg-surface border border-border rounded-xl px-3 py-2.5 text-sm text-ink" />
        </div>
        <div>
          <div className="text-xs text-inkDim mb-1.5">Urlaubstage/Jahr</div>
          <input type="text" inputMode="numeric" value={vacStr}
            onChange={e => setVacStr(e.target.value)}
            onBlur={() => {
              const v = parseInt(vacStr);
              if (!isNaN(v) && v >= 0) set('vacationDaysPerYear', v);
              setVacStr(String(isNaN(v) || v < 0 ? (work.vacationDaysPerYear ?? 30) : v));
            }}
            className="w-full bg-surface border border-border rounded-xl px-3 py-2.5 text-sm text-ink" />
        </div>
        <div>
          <div className="text-xs text-inkDim mb-1.5">Anstellungsbeginn</div>
          <div className="flex gap-2">
            <input type="date" value={startDateStr}
              onChange={e => setStartDateStr(e.target.value)}
              onBlur={() => {
                // Nur einen vollständigen Datumswert übernehmen — ein leerer
                // Zwischenwert (manche Android-Datumswähler feuern das während
                // der Auswahl) darf NICHT versehentlich das Feld löschen.
                if (/^\d{4}-\d{2}-\d{2}$/.test(startDateStr)) set('startDate', startDateStr);
                else setStartDateStr(work.startDate || '');
              }}
              className="flex-1 bg-surface border border-border rounded-xl px-3 py-2.5 text-sm text-ink" />
            {work.startDate && (
              <button onClick={() => { setStartDateStr(''); set('startDate', null); }}
                className="text-xs text-inkDim border border-border rounded-xl px-3 active:scale-95">
                ✕
              </button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function WorkTimerScreen({ profile, onClose, onClockIn, onClockOut, onAddSickDay, onDeleteSickDay, onAddVacation, onDeleteVacation, onBuyOvertime, onConvertVacToOT, onReset, onSetOvertimeManually }) {
  const work = profile.work || {};

  // ---- alle Hooks zuerst ----
  const [tick, setTick] = useState(0);
  const [showSick, setShowSick] = useState(false);
  const [sickFrom, setSickFrom] = useState(todayBerlin());
  const [sickTo, setSickTo] = useState(todayBerlin());
  const [showStopConfirm, setShowStopConfirm] = useState(false);
  const [showBuyOT, setShowBuyOT] = useState(false);
  const [showManualOT, setShowManualOT] = useState(false);
  const [manualOTValue, setManualOTValue] = useState('0');
  const [buyOTAmount, setBuyOTAmount] = useState('1');
  const [showVacToOT, setShowVacToOT] = useState(false);
  const [vacToOTDays, setVacToOTDays] = useState('0.5');
  const [showVacation, setShowVacation] = useState(false);
  const [vacFrom, setVacFrom] = useState(todayBerlin());
  const [vacTo, setVacTo] = useState(todayBerlin());

  useEffect(() => {
    const iv = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(iv);
  }, []);

  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const [resetConfirmMsg, setResetConfirmMsg] = useState('');

  useBackButton(showResetConfirm, () => setShowResetConfirm(false));
  useBackButton(showBuyOT, () => setShowBuyOT(false));
  useBackButton(showManualOT, () => setShowManualOT(false));
  useBackButton(showVacToOT, () => setShowVacToOT(false));
  useBackButton(showVacation, () => setShowVacation(false));
  useBackButton(showSick, () => setShowSick(false));
  useBackButton(showStopConfirm, () => setShowStopConfirm(false));

  // ---- berechnete Werte ----
  const sessionMins = calcCurrentSessionMinutes(work);
  const isSick = isSickToday(work);
  const isVacation = isVacationToday(work);
  const isWorkDay = isWorkDayToday(work);
  // An Urlaubs- und Kranktagen gilt das Soll als erfüllt → alles Gearbeitete zählt als Überstunden
  const isFreeDay = !isWorkDay || isSick || isVacation;
  const requiredMins = isFreeDay ? 0 : (work.hoursPerDay || 8) * 60;

  // Gesamt-Tagesleistung = frühere Sitzungen + aktuelle Sitzung
  const workedBefore = work.workedMinutesToday || 0;
  const totalWorkedToday = sessionMins + workedBefore;

  const displayMins = Math.floor(totalWorkedToday % 60);
  const displayHrs = Math.floor(totalWorkedToday / 60);
  const displaySecs = Math.floor((sessionMins * 60) % 60); // Sekunden aus aktueller Sitzung
  const progress = requiredMins > 0
    ? Math.min(1, totalWorkedToday / requiredMins)
    : Math.min(1, sessionMins / 480);
  const progressColor = requiredMins > 0
    ? (totalWorkedToday < requiredMins ? '#d4a843' : '#4a9b6e')
    : '#4a9b6e';

  const R = 110, STROKE = 14, C = 2 * Math.PI * R;
  const dashOffset = C * (1 - progress);
  const notStartedYet = work.startDate && todayBerlin() < work.startDate;

  function handleStop() {
    onClockOut();
  }

  return (
    <div className="fixed inset-0 z-[200] flex justify-center bg-black/30">
      <div className="w-full max-w-md bg-bg flex flex-col items-center justify-between py-14 px-6">
        {/* Header */}
        <div className="w-full flex items-center justify-between">
          <button onClick={onClose} className="text-inkDim text-sm">✕ Schließen</button>
          <div className="font-display font-bold text-gold text-xl">Arbeitszeit</div>
          <div style={{ width: 60 }} className="flex justify-end">
            <button onClick={() => {
                const hasProgress = work.clockedIn || (work.workedMinutesToday || 0) > 0;
                if (!hasProgress) { onReset('none'); return; }
                setResetConfirmMsg(`Heutigen Fortschritt zurücksetzen?\n${formatHM(totalWorkedToday)} werden verworfen — es wurde noch nichts gebucht.`);
                setShowResetConfirm(true);
              }}
              className="text-xs text-hp border border-hp/30 rounded-lg px-2 py-1 active:scale-95">
              ↺ Reset
            </button>
          </div>
        </div>

        {/* Krank / Urlaub */}
        <div className="flex gap-3 mt-2">
          <button onClick={() => setShowSick(true)}
            className={`text-sm border rounded-xl px-4 py-2.5 active:scale-95 ${isSick ? 'border-hp/60 bg-hp/10 text-hp' : 'border-border text-inkDim'}`}>
            🤒 Krank
          </button>
          <button onClick={() => setShowVacation(true)}
            className={`text-sm border rounded-xl px-4 py-2.5 active:scale-95 ${isVacation ? 'border-[#c026d3]/60 bg-[#c026d3]/10 text-[#c026d3]' : 'border-border text-inkDim'}`}>
            🌴 Urlaub
          </button>
        </div>

        {/* Ring */}
        {notStartedYet ? (
          <div className="flex flex-col items-center justify-center gap-3 py-8">
            <div className="text-5xl">📅</div>
            <div className="text-ink font-semibold text-center">Arbeit beginnt erst am</div>
            <div className="font-display text-gold text-2xl">{work.startDate?.split('-').reverse().join('.')}</div>
            <div className="text-xs text-inkDim text-center">Du kannst dich erst ab diesem Datum einstempeln.</div>
          </div>
        ) : (
        <div onClick={work.clockedIn ? () => setShowStopConfirm(true) : onClockIn}
          className="relative cursor-pointer">
          <svg width="260" height="260" viewBox="0 0 260 260">
            <circle cx="130" cy="130" r={R} fill="none" stroke="#1e1e2e" strokeWidth={STROKE} />
            <circle cx="130" cy="130" r={R} fill="none" stroke={progressColor} strokeWidth={STROKE}
              strokeLinecap="round" strokeDasharray={C} strokeDashoffset={dashOffset}
              transform="rotate(-90 130 130)"
              style={{ transition: 'stroke-dashoffset 0.9s linear, stroke 0.5s' }} />
            <circle cx="130" cy="130" r="80" fill="transparent" />
            {work.clockedIn ? (<>
              <text x="130" y="120" textAnchor="middle" fill="white" fontSize="42" fontWeight="bold" fontFamily="monospace">
                {String(displayHrs).padStart(2,'0')}:{String(displayMins).padStart(2,'0')}
              </text>
              <text x="130" y="148" textAnchor="middle" fill="#555" fontSize="18" fontFamily="monospace">
                :{String(displaySecs).padStart(2,'0')}
              </text>
              {!isFreeDay && totalWorkedToday < requiredMins && (
                <text x="130" y="172" textAnchor="middle" fill="#e55353" fontSize="12">{`noch ${formatHM(requiredMins - totalWorkedToday)}`}</text>
              )}
              {!isFreeDay && totalWorkedToday >= requiredMins && (
                <text x="130" y="172" textAnchor="middle" fill="#4a9b6e" fontSize="12">Tagesziel erreicht ✓</text>
              )}
              {isFreeDay && (
                <text x="130" y="172" textAnchor="middle" fill="#4a9b6e" fontSize="12">
                  {isSick ? 'Krank → Überstunden' : isVacation ? 'Urlaub → Überstunden' : 'Freier Tag → Überstunden'}
                </text>
              )}
            </>) : (<>
              <text x="130" y="115" textAnchor="middle" fill="white" fontSize="15">▶</text>
              <text x="130" y="140" textAnchor="middle" fill="#888" fontSize="13">
                {workedBefore > 0 ? 'Antippen zum Fortsetzen' : 'Antippen zum Einstempeln'}
              </text>
              {workedBefore > 0 && (
                <text x="130" y="160" textAnchor="middle" fill="#d4a843" fontSize="12">{`Bisher heute: ${formatHM(workedBefore)}`}</text>
              )}
            </>)}
          </svg>
        </div>
        )}

        {/* Infoleiste */}
        <div className="w-full grid grid-cols-2 gap-3">
          <div className="bg-surface border border-border rounded-2xl p-3.5 flex flex-col gap-2">
            <div className="flex items-center justify-between">
              <div className="text-[10px] text-inkDim uppercase tracking-wide">Überstundenkonto</div>
              <button onClick={() => { setManualOTValue(String(Math.round(work.overtimeMinutes||0))); setShowManualOT(true); }}
                className="text-inkDim text-xs active:scale-90" title="Manuell korrigieren">
                ✎
              </button>
            </div>
            <div className={`font-stat text-lg font-bold ${work.overtimeMinutes >= 0 ? 'text-heal' : 'text-hp'}`}>
              {formatHM(work.overtimeMinutes||0)}
            </div>
            <button onClick={() => { setBuyOTAmount(1); setShowBuyOT(true); }}
              disabled={profile.gold < 1}
              className="flex items-center justify-center gap-1.5 border border-gold/40 bg-gold/10 text-gold rounded-xl py-2 disabled:opacity-30 active:scale-95 text-xs font-semibold">
              <span>💰</span> G → Min
            </button>
          </div>
          <div className="bg-surface border border-border rounded-2xl p-3.5 flex flex-col gap-2">
            <div className="text-[10px] text-inkDim uppercase tracking-wide">Urlaub verfügbar</div>
            <div className="font-stat text-lg font-bold text-[#c026d3]">
              {calcAvailableVacation(work).toFixed(1)} <span className="text-xs font-normal">Tage</span>
            </div>
            <button onClick={() => { setVacToOTDays(0.5); setShowVacToOT(true); }}
              disabled={calcAvailableVacation(work) <= 0}
              className="flex items-center justify-center gap-1.5 border border-[#c026d3]/40 bg-[#c026d3]/10 text-[#c026d3] rounded-xl py-2 disabled:opacity-30 active:scale-95 text-xs font-semibold">
              <span>⏱</span> → Überstd.
            </button>
          </div>
        </div>

        {/* Gold → Überstunden Popup */}
        {showBuyOT && (
          <div className="fixed inset-0 z-[300] flex items-center justify-center bg-black/60 px-4">
            <div className="w-full max-w-sm bg-bgElevated border border-border rounded-2xl p-5 space-y-4">
              <div className="font-display font-bold text-gold">G → Überstunden kaufen</div>
              <div className="text-xs text-inkDim">1 G = 1 Minute · Guthaben: {profile.gold} G</div>
              <div className="flex items-center gap-3">
                <button onClick={() => setBuyOTAmount(a => String(Math.max(1, (parseInt(a)||1)-1)))} className="w-9 h-9 rounded-xl border border-border text-ink text-lg active:scale-95">−</button>
                <input type="text" inputMode="numeric" value={buyOTAmount}
                  onChange={e => setBuyOTAmount(e.target.value)}
                  className="flex-1 bg-surface border border-border rounded-xl px-3 py-2 text-sm text-ink text-center font-stat" />
                <button onClick={() => setBuyOTAmount(a => String(Math.min(profile.gold, (parseInt(a)||0)+1)))} className="w-9 h-9 rounded-xl border border-border text-ink text-lg active:scale-95">+</button>
              </div>
              <div className="text-xs text-center text-inkDim">{buyOTAmount} G → {parseInt(buyOTAmount) > 0 ? formatHM(parseInt(buyOTAmount)) : "–"}</div>
              <div className="flex gap-2">
                <button onClick={() => setShowBuyOT(false)} className="flex-1 border border-border rounded-xl py-2.5 text-sm text-inkDim">Abbrechen</button>
                <button onClick={() => { const n = parseInt(buyOTAmount); if (n > 0) { onBuyOvertime(n); setShowBuyOT(false); } }}
                  disabled={profile.gold < (parseInt(buyOTAmount)||0) || (parseInt(buyOTAmount)||0) < 1}
                  className="flex-1 bg-gold/20 border border-gold/50 text-gold disabled:opacity-30 rounded-xl py-2.5 text-sm font-semibold">
                  Kaufen
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Überstundenkonto manuell korrigieren — falls Testdaten/alte Bugs den Wert
            verfälscht haben und sich das nicht automatisch zurückrechnen lässt. */}
        {showManualOT && (
          <div className="fixed inset-0 z-[300] flex items-center justify-center bg-black/60 px-4">
            <div className="w-full max-w-sm bg-bgElevated border border-border rounded-2xl p-5 space-y-4">
              <div className="font-display font-bold text-gold">Überstundenkonto korrigieren</div>
              <div className="text-xs text-inkDim">Aktuell: {formatHM(work.overtimeMinutes||0)} · Wert in Minuten eingeben (negativ = Minus-Konto)</div>
              <input type="text" inputMode="numeric" value={manualOTValue}
                onChange={e => setManualOTValue(e.target.value.replace(/[^-\d]/g, ''))}
                className="w-full bg-surface border border-border rounded-xl px-3 py-2.5 text-sm text-ink text-center font-stat" />
              <div className="text-xs text-center text-inkDim">
                {/^-?\d+$/.test(manualOTValue) ? `= ${formatHM(parseInt(manualOTValue))}` : '–'}
              </div>
              <div className="flex gap-2">
                <button onClick={() => setShowManualOT(false)} className="flex-1 border border-border rounded-xl py-2.5 text-sm text-inkDim">Abbrechen</button>
                <button onClick={() => {
                    if (/^-?\d+$/.test(manualOTValue)) { onSetOvertimeManually(parseInt(manualOTValue)); setShowManualOT(false); }
                  }}
                  disabled={!/^-?\d+$/.test(manualOTValue)}
                  className="flex-1 bg-gold/20 border border-gold/50 text-gold disabled:opacity-30 rounded-xl py-2.5 text-sm font-semibold">
                  Speichern
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Urlaubstage → Überstunden */}
        {showVacToOT && (
          <div className="fixed inset-0 z-[300] flex items-center justify-center bg-black/60 px-4">
            <div className="w-full max-w-sm bg-bgElevated border border-border rounded-2xl p-5 space-y-4">
              <div className="font-display font-bold text-[#c026d3]">🌴 → ⏱ Urlaub in Überstunden</div>
              <div className="text-xs text-inkDim">Verfügbar: {calcAvailableVacation(work).toFixed(1)} Tage · 1 Tag = {formatHM((work.hoursPerDay||8)*60)}</div>
              <div className="space-y-2">
                <div className="flex gap-2 items-center">
                  <span className="text-xs text-inkDim w-16">Tage</span>
                  <input type="text" inputMode="decimal" value={vacToOTDays}
                    onChange={e => setVacToOTDays(e.target.value)}
                    className="flex-1 bg-surface border border-border rounded-xl px-3 py-2 text-sm text-ink text-center font-stat" />
                </div>
                <div className="text-xs text-center text-inkDim">= {parseFloat(vacToOTDays) > 0 ? formatHM(parseFloat(vacToOTDays) * (work.hoursPerDay||8) * 60) : "–"} Überstunden</div>
              </div>
              <div className="flex gap-2">
                <button onClick={() => setShowVacToOT(false)} className="flex-1 border border-border rounded-xl py-2.5 text-sm text-inkDim">Abbrechen</button>
                <button onClick={() => { const n = parseFloat(vacToOTDays); if (n > 0) { onConvertVacToOT(n); setShowVacToOT(false); } }}
                  disabled={!(parseFloat(vacToOTDays) > 0) || parseFloat(vacToOTDays) > calcAvailableVacation(work)}
                  className="flex-1 bg-[#c026d3]/20 border border-[#c026d3]/50 text-[#c026d3] disabled:opacity-30 rounded-xl py-2.5 text-sm font-semibold">
                  Umwandeln
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Reset-Bestätigung */}
        {showResetConfirm && (
          <div className="fixed inset-0 z-[300] flex items-center justify-center bg-black/70 px-4">
            <div className="w-full max-w-sm bg-bgElevated border border-hp/40 rounded-2xl p-5 space-y-4">
              <div className="font-display font-bold text-hp">⚠️ Arbeitstag zurücksetzen</div>
              <div className="text-sm text-ink leading-relaxed whitespace-pre-line">{resetConfirmMsg}</div>
              <div className="flex gap-2">
                <button onClick={() => setShowResetConfirm(false)}
                  className="flex-1 border border-border rounded-xl py-2.5 text-sm text-inkDim active:scale-95">
                  Abbrechen
                </button>
                <button onClick={() => { setShowResetConfirm(false); onReset('confirmed'); }}
                  className="flex-1 bg-hp/20 border border-hp/50 text-hp rounded-xl py-2.5 text-sm font-semibold active:scale-95">
                  Zurücksetzen
                </button>
              </div>
            </div>
          </div>
        )}

        {/* Krankmeldungs-Modal */}
        {showSick && (
          <div className="fixed inset-0 z-[300] flex items-center justify-center bg-black/60 px-4">
            <div className="w-full max-w-sm bg-bgElevated border border-border rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto">
              <div className="font-display font-bold text-hp">🤒 Krankmeldung</div>
              <div className="space-y-2">
                <div className="flex gap-2 items-center">
                  <span className="text-xs text-inkDim w-12">Von</span>
                  <input type="date" value={sickFrom} onChange={e => {
                    const v = e.target.value;
                    setSickFrom(v);
                    if (sickTo < v) setSickTo(v);
                  }} className="flex-1 bg-surface border border-border rounded-xl px-3 py-2 text-sm text-ink" />
                </div>
                <div className="flex gap-2 items-center">
                  <span className="text-xs text-inkDim w-12">Bis</span>
                  <input type="date" value={sickTo} min={sickFrom} onChange={e => setSickTo(e.target.value)}
                    className="flex-1 bg-surface border border-border rounded-xl px-3 py-2 text-sm text-ink" />
                </div>
              </div>
              <button onClick={() => { onAddSickDay(sickFrom, sickTo); }}
                className="w-full bg-hp/20 border border-hp/50 text-hp rounded-xl py-2.5 text-sm font-semibold active:scale-[0.99]">
                Eintragen
              </button>
              {(work.sickDays||[]).length > 0 && (
                <div className="border-t border-border pt-3 space-y-1.5">
                  <div className="text-xs text-inkDim font-semibold">Eingetragene Kranktage</div>
                  {[...(work.sickDays||[])].sort((a,b) => a.from.localeCompare(b.from)).map((s, idx) => (
                    <div key={s.id || s.from + idx} className="flex items-center justify-between text-xs">
                      <span className="text-ink">{s.from === s.to ? s.from : `${s.from} – ${s.to}`}</span>
                      <button onClick={() => onDeleteSickDay(s.id || s.from)}
                        className="text-hp ml-2 px-1.5 py-0.5 border border-hp/30 rounded active:scale-95">
                        ↩
                      </button>
                    </div>
                  ))}
                </div>
              )}
              <button onClick={() => setShowSick(false)} className="w-full border border-border rounded-xl py-2.5 text-sm text-inkDim">Schließen</button>
            </div>
          </div>
        )}

        {/* Urlaubs-Modal */}
        {showVacation && (() => {
          // Arbeitstage (ohne Feiertage) — identisch mit dem was beim Eintragen abgezogen wird
          const previewDays = countWorkDays(vacFrom, vacTo, work);
          const minutesNeeded = previewDays * (work.hoursPerDay || 8) * 60;
          const canUseOvertime = (work.overtimeMinutes || 0) >= minutesNeeded;
          const availableVac = calcAvailableVacation(work);

          return (
          <div className="fixed inset-0 z-[300] flex items-center justify-center bg-black/60 px-4">
            <div className="w-full max-w-sm bg-bgElevated border border-border rounded-2xl p-5 space-y-4">
              <div className="font-display font-bold text-gold">🌴 Urlaub eintragen</div>
              <div className="space-y-2">
                <div className="flex gap-2 items-center">

function WorkAnalysis({ profile, onClose }) {
  const work = profile.work || {};
  const log = work.workLog || [];
  const [range, setRange] = useState(7);

  const cutoff = range === 0 ? null : addDays(todayBerlin(), -range);
  const rangeTo = todayBerlin();
  const filtered = log.filter(e => !cutoff || e.date >= cutoff);

  const workDays = filtered.filter(e => e.type === 'work');
  const totalWorked = workDays.reduce((s, e) => s + (e.workedMinutes||0), 0);
  const totalRequired = workDays.reduce((s, e) => s + (e.requiredMinutes||0), 0);
  const totalOvertime = workDays.reduce((s, e) => s + (e.overtimeDelta||0), 0);
  const absentCount = filtered.filter(e => e.type === 'absent').length;

  // Kranktage/Urlaubstage stehen NICHT im workLog, sondern in eigenen Arrays —
  // hier korrekt für den gewählten Zeitraum aus den tatsächlichen Einträgen berechnen.
  function daysInRangeFrom(entries, filterFn) {
    let total = 0;
    (entries || []).forEach(entry => {
      if (filterFn && !filterFn(entry)) return;
      const from = !cutoff || entry.from > cutoff ? entry.from : cutoff;
      const to = entry.to < rangeTo ? entry.to : rangeTo;
      if (from > to) return;
      total += countWorkDays(from, to, work);
    });
    return total;
  }
  const sickCount = daysInRangeFrom(work.sickDays);
  const vacUsedCount = daysInRangeFrom(work.vacationDays, v => v.type !== 'overtime');

  return (
    <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/70 px-4" onClick={onClose}>
      <div className="w-full max-w-md bg-bgElevated border border-border rounded-2xl p-5 space-y-4 max-h-[85vh] overflow-y-auto"
        onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between">
          <span className="font-display font-bold text-gold text-lg">Arbeitszeitanalyse</span>
          <button onClick={onClose} className="text-inkDim text-xl">✕</button>
        </div>
        <div className="flex gap-2">
          {[{l:'7 Tage',v:7},{l:'30 Tage',v:30},{l:'Max',v:0}].map(({l,v}) => (
            <button key={v} onClick={() => setRange(v)}
              className={`flex-1 py-2 rounded-xl text-sm font-semibold border ${range===v ? 'bg-gold/20 border-gold/60 text-gold' : 'bg-surface border-border text-inkDim'}`}>
              {l}
            </button>
          ))}
        </div>
        <div className="space-y-2.5">
          <div className="flex justify-between text-sm"><span className="text-inkDim">Gearbeitet</span><span className="font-stat text-ink">{formatHM(totalWorked)}</span></div>
          <div className="flex justify-between text-sm"><span className="text-inkDim">Soll</span><span className="font-stat text-ink">{formatHM(totalRequired)}</span></div>
          <div className="flex justify-between text-sm"><span className="text-inkDim">Zeitraum-Bilanz</span><span className={`font-stat ${totalOvertime>=0?'text-heal':'text-hp'}`}>{totalOvertime>=0?'+':''}{formatHM(totalOvertime)}</span></div>
          <div className="h-px bg-border" />
          <div className="flex justify-between text-sm"><span className="text-inkDim">Überstundenkonto gesamt</span><span className={`font-stat ${(work.overtimeMinutes||0)>=0?'text-heal':'text-hp'}`}>{formatHM(work.overtimeMinutes||0)}</span></div>
          <div className="flex justify-between text-sm"><span className="text-inkDim">Urlaub verfügbar</span><span className="font-stat text-gold">{calcAvailableVacation(work).toFixed(1)} Tage</span></div>
          <div className="flex justify-between text-sm"><span className="text-inkDim">Krankheitstage (Zeitraum)</span><span className="font-stat text-ink">{sickCount}</span></div>
          <div className="flex justify-between text-sm"><span className="text-inkDim">Urlaubstage genommen (Zeitraum)</span><span className="font-stat text-[#c026d3]">{vacUsedCount}</span></div>
          {absentCount > 0 && <div className="flex justify-between text-sm"><span className="text-inkDim">Fehltage ohne Eintrag</span><span className="font-stat text-hp">{absentCount}</span></div>}
        </div>
        {workDays.length > 0 && (
          <div className="space-y-1.5">
            <div className="text-xs text-inkDim font-semibold">Letzte Einträge</div>
            {workDays.slice(-5).reverse().map((e,i) => (
              <div key={i} className="flex justify-between text-xs text-inkDim">
                <span>{e.date} · {formatHM(e.workedMinutes||0)} gearbeitet</span>
                <span className={e.overtimeDelta >= 0 ? 'text-heal' : 'text-hp'}>{e.overtimeDelta>=0?'+':''}{formatHM(e.overtimeDelta)}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function TodoSidebar({ profile, open, onToggle, onAdd, onCheck, onDelete }) {
  const [input, setInput] = useState('');
  const inputRef = useRef(null);

  const todos = profile.todos || [];
  const pending = todos.filter(t => !t.done).sort((a, b) => a.createdAt - b.createdAt);
  const done = todos.filter(t => t.done).sort((a, b) => b.doneAt - a.doneAt);

  function submit() {
    const text = input.trim();
    if (!text) return;
    onAdd(text);
    setInput('');
    inputRef.current?.focus();
  }

  return (
    <>
      {/* Backdrop */}
      {open && (
        <div className="fixed inset-0 z-40 bg-black/50" onClick={onToggle} />
      )}

      {/* Sidebar */}
      <div className="fixed top-0 left-0 h-full z-50 flex"
        style={{ transform: open ? 'translateX(0)' : 'translateX(-316px)', transition: 'transform 280ms cubic-bezier(0.4,0,0.2,1)' }}>

        {/* Panel */}
        <div className="w-80 h-full bg-bgElevated border-r border-border flex flex-col shadow-2xl">
          <div className="px-4 pt-10 pb-3 border-b border-border shrink-0">
            <div className="font-display font-bold text-gold text-base">Notizen & ToDos</div>
          </div>

          {/* Input */}
          <div className="px-3 pt-3 pb-2 shrink-0 border-b border-border/50">
            <div className="flex gap-2">
              <input
                ref={inputRef}
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && submit()}
                placeholder="Hinzufügen…"
                className="flex-1 bg-surface border border-border rounded-xl px-3 py-2 text-sm text-ink placeholder-inkDim/50 min-w-0"
              />
              <button onClick={submit}
                className="w-9 h-9 rounded-xl bg-gold text-bg flex items-center justify-center text-lg font-bold shrink-0 active:scale-95">
                +
              </button>
            </div>
          </div>

          {/* Pending Items */}
          <div className="flex-1 overflow-y-auto px-3 py-2 space-y-1.5">
            {pending.length === 0 && done.length === 0 && (
              <p className="text-xs text-inkDim pt-2 text-center">Noch keine Einträge.</p>
            )}
            {pending.map(t => (
              <div key={t.id} className="flex items-start gap-2.5 group">
                <button onClick={() => onCheck(t.id)}
                  className="mt-0.5 w-4.5 h-4.5 rounded border-2 border-border shrink-0 active:scale-95 hover:border-gold transition-colors"
                  style={{ width: 18, height: 18, minWidth: 18 }} />
                <span className="text-sm text-ink flex-1 leading-snug pt-px">{t.text}</span>
                <button onClick={() => onDelete(t.id)}
                  className="text-inkDim opacity-0 group-hover:opacity-100 text-xs px-1 shrink-0 transition-opacity active:scale-95">
                  ✕
                </button>
              </div>
            ))}

            {/* Protokoll */}
            {done.length > 0 && (
              <div className="pt-3">
                <div className="text-[10px] text-inkDim font-semibold uppercase tracking-wider mb-1.5 px-0.5">
                  Protokoll
                </div>
                {done.map(t => (
                  <div key={t.id} className="flex items-start gap-2.5 py-1 group">
                    <div className="mt-0.5 shrink-0 flex items-center justify-center"
                      style={{ width: 18, height: 18 }}>
                      <div className="w-3 h-3 rounded-sm bg-heal/40 flex items-center justify-center">
                        <span className="text-[8px] text-heal">✓</span>
                      </div>
                    </div>
                    <span className="text-xs text-inkDim flex-1 line-through leading-snug pt-px">{t.text}</span>
                    <button onClick={() => onDelete(t.id)}
                      className="text-inkDim opacity-0 group-hover:opacity-100 text-xs px-1 shrink-0 transition-opacity active:scale-95">
                      ✕

                ))}
              </div>
            )}

        </div>

        {/* Pfeil-Toggle */}
        <button onClick={onToggle}

  );
}

function DeadlineRow({ quest, deadline, calendarViewedDate, activeProfile, onComplete }) {
  const dayProgress = (activeProfile.questProgress || {})[calendarViewedDate] || {};
  const done = dayProgress[quest.id] === 'komplett';
  const failed = !done && deadline.date < todayBerlin();
  const days = daysUntil(deadline.date);
  const urgent = days <= 1;
  const label = deadlineLabel(deadline.date);
  return (
    <div className={`flex items-center gap-2.5 rounded-xl border px-3 py-2.5 ${
      done   ? 'border-heal/40 bg-heal/5 opacity-60' :
      failed ? 'border-border bg-surface opacity-50' :
      urgent ? 'border-hp/60 bg-hp/5' :
               'border-orange/40 bg-orange/5'
    }`}>
      <span className="text-lg shrink-0">{failed ? '❌' : quest.icon}</span>
      <div className="flex-1 min-w-0">
        <div className={`text-sm truncate ${(done || failed) ? 'line-through text-inkDim' : 'text-ink'}`}>{quest.title}</div>
        <div className={`text-[10px] font-bold ${failed ? 'text-inkDim' : urgent ? 'text-hp' : 'text-orange'}`}>
          {failed ? 'Frist verpasst' : `🔒 ${label}${(!deadline.allDay && deadline.time) ? ` · ${deadline.time}` : ''}`}
        </div>
      </div>
      {!done && !failed && (
        <button onClick={onComplete}
          className="shrink-0 border border-heal/50 bg-heal/10 text-heal text-xs font-semibold rounded-lg px-2.5 py-2 active:scale-95">
          Fertig
        </button>
      )}
    </div>
  );
}
